<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리포트 레이더</title>
<script>
/* 테마를 그리기 전에 정해 둔다 (깜빡임 방지) */
(function(){
  var t = null;
  try{ t = localStorage.getItem("report-radar/theme/v1"); }catch(e){}
  document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
})();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ===== 디자인 토큰 (다크 기본 · 한국식 등락색) ===== */
:root{
  --bg:#22262F; --panel:#353945; --panel2:#2C303A; --line:#4C5263; --line2:#5C6377;
  --tx:#F3F3F5; --tx2:#C3C6D0; --tx3:#8B91A1;
  --link:#2F91EF; --link-h:#4FA4F4;
  --up:#FD8487; --down:#7FB2F5; --up-bg:#FB5057; --down-bg:#2F6FEF;
  --heat-up:#691F24; --heat-mid:#414554; --heat-down:#1B3F86;
  --shadow:0 6px 18px rgba(0,0,0,.45);
  --hh:60px;
}
html[data-theme="light"]{
  --bg:#EEF0F4; --panel:#FFFFFF; --panel2:#F5F6F9; --line:#C9CEDB; --line2:#AEB5C6;
  --tx:#1A1D24; --tx2:#4A5060; --tx3:#7A8091;
  --link:#1567C8; --link-h:#0F4E9C;
  --up:#D2373C; --down:#1D5FC4; --up-bg:#D2373C; --down-bg:#1D5FC4;
  --heat-up:#C2333A; --heat-mid:#B9BECC; --heat-down:#1D5FC4;
  --shadow:0 6px 18px rgba(10,14,22,.16);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--tx);font-size:12px;line-height:1.45;
  font-family:"Pretendard Variable",Pretendard,"Segoe UI",system-ui,-apple-system,
              "Malgun Gothic","맑은 고딕",sans-serif;
  -webkit-font-smoothing:antialiased;
}
table,.num,.date,.ttip,.ovi .v,.ovi .c,.tile .tp,.tile .tn2{font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link);text-decoration:none}
a:hover{color:var(--link-h);text-decoration:underline}
[hidden]{display:none !important}
.wrap{max-width:1560px;margin:0 auto;padding:0 10px}
.muted{color:var(--tx3)}
.strong{font-weight:700}

/* ---------- 헤더 ---------- */
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:60}
.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 0}
.brand{font-size:14px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
.brand span{color:var(--link)}
.tick{display:flex;gap:14px;flex-wrap:wrap;flex:1;min-width:0;font-size:11.5px;align-items:center}
.tick .t{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.tick .t .n{color:var(--tx2);font-weight:600;font-size:11px}
.tick .t b{font-weight:600}
.hd-r{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.upd{font-size:11px;color:var(--tx3);white-space:nowrap}
.mkb{
  font-size:10.5px;padding:2px 6px;border-radius:2px;border:1px solid var(--line);
  background:var(--panel2);color:var(--tx3);font-weight:600;white-space:nowrap;
}
.mkb.open{background:rgba(251,80,87,.16);border-color:var(--up-bg);color:var(--up)}
.btn{
  background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:3px 8px;
  font-size:11px;font-weight:600;color:var(--tx2);white-space:nowrap;
}
.btn:hover{border-color:var(--line2);color:var(--tx)}

nav.tabs{display:flex;border-bottom:1px solid transparent;overflow-x:auto}
nav.tabs button{
  background:none;border:none;border-bottom:2px solid transparent;
  padding:7px 15px;font-size:12px;font-weight:600;color:var(--tx2);white-space:nowrap;
}
nav.tabs button:hover{color:var(--tx);background:var(--panel2)}
nav.tabs button.act{color:var(--link);border-bottom-color:var(--link)}

main{padding:10px 0 26px}

/* ---------- 패널 ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;margin-bottom:10px}
.ptitle{
  font-size:11.5px;font-weight:700;color:var(--tx2);padding:5px 8px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-transform:uppercase;letter-spacing:.3px;
}
.ptitle .sub{text-transform:none;letter-spacing:0;font-weight:400;color:var(--tx3);font-size:11px}
.ptitle .sp{
  margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  text-transform:none;letter-spacing:0;font-weight:400;
}
.pbody{padding:7px 8px}

/* ---------- 개요 ---------- */
.ovw{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.ovi{display:flex;flex-direction:column;gap:1px;min-width:78px}
.ovi .k{font-size:10.5px;color:var(--tx3);font-weight:600;white-space:nowrap}
.ovi .v{font-size:17px;font-weight:600;letter-spacing:-.4px}
.ovi .v.u{color:var(--up)}.ovi .v.d{color:var(--down)}
.ovi .c{font-size:10.5px;color:var(--tx3)}

/* ---------- 필터 ---------- */
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end}
.fl{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--tx3);font-weight:600}
.fl>.k{text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{
  background:none;border:none;padding:3px 9px;font-size:11px;font-weight:600;color:var(--tx3);
  border-right:1px solid var(--line);
}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--tx)}
.seg button[aria-pressed="true"],.seg button.act{background:var(--link);color:#fff}
.chip{
  border:1px solid var(--line);background:var(--panel2);color:var(--tx3);
  padding:3px 9px;border-radius:2px;font-size:11px;font-weight:600;white-space:nowrap;
}
.chip:hover{border-color:var(--line2);color:var(--tx)}
.chip[aria-pressed="true"]{background:var(--link);border-color:var(--link);color:#fff}
.chip.r-BUY[aria-pressed="true"]{background:var(--up-bg);border-color:var(--up-bg)}
.chip.r-SELL[aria-pressed="true"]{background:var(--down-bg);border-color:var(--down-bg)}
.chip.r-HOLD[aria-pressed="true"]{background:var(--line2);border-color:var(--line2)}
.chip.r-NR[aria-pressed="true"]{background:var(--tx3);border-color:var(--tx3)}
input[type=search],select{
  background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:3px 6px;
  font-size:11.5px;outline:none;color:var(--tx);font-weight:400;
}
input[type=search]{width:210px;max-width:100%}
select{max-width:190px;font-weight:600;color:var(--tx2)}
input:focus,select:focus{border-color:var(--link)}
select.on{color:var(--tx);border-color:var(--link)}
.linkbtn{
  background:none;border:0;font-size:11px;color:var(--link);padding:2px 2px;font-weight:600;
}
.linkbtn:hover{color:var(--link-h);text-decoration:underline}
.count{font-size:11px;color:var(--tx3);white-space:nowrap}

/* 증권사 드롭다운 */
.dd{position:relative}
.dd>summary{
  list-style:none;cursor:pointer;padding:3px 8px;border:1px solid var(--line);border-radius:3px;
  background:var(--panel2);font-size:11.5px;font-weight:600;color:var(--tx2);user-select:none;
  white-space:nowrap;
}
.dd>summary::-webkit-details-marker{display:none}
.dd[open]>summary{border-color:var(--link);color:var(--tx)}
.dd-panel{
  position:absolute;z-index:50;top:calc(100% + 3px);left:0;width:260px;max-height:300px;
  overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:3px;
  padding:6px;box-shadow:var(--shadow);
}
.dd-panel label{
  display:flex;gap:6px;align-items:center;padding:2px 4px;border-radius:2px;cursor:pointer;
  font-size:11.5px;color:var(--tx2);font-weight:400;
}
.dd-panel label:hover{background:var(--panel2);color:var(--tx)}
.dd-actions{
  display:flex;gap:5px;margin-bottom:5px;position:sticky;top:0;background:var(--panel);padding-bottom:5px;
}
.dd-actions button{
  flex:1;font-size:11px;font-weight:600;padding:3px;border:1px solid var(--line);
  border-radius:2px;background:var(--panel2);color:var(--tx3);
}
.dd-actions button:hover{color:var(--tx);border-color:var(--line2)}

/* ---------- 검색 자동완성 ---------- */
.searchbox{position:relative}
/* 검색칸이 필터 줄 오른쪽 끝이라 오른쪽에 붙여야 화면 밖으로 나가지 않는다 */
.ac{
  position:absolute;z-index:55;top:calc(100% + 3px);right:0;width:320px;max-width:88vw;
  max-height:320px;overflow:auto;background:var(--panel);border:1px solid var(--line2);
  border-radius:3px;box-shadow:var(--shadow);
}
.ac-sec{
  padding:5px 8px 2px;font-size:10px;font-weight:700;letter-spacing:.3px;
  color:var(--tx3);border-top:1px solid var(--line);text-transform:uppercase;
}
.ac-sec:first-child{border-top:0}
.ac-item{
  display:flex;align-items:baseline;gap:6px;padding:4px 8px;cursor:pointer;font-size:11.5px;
  border-bottom:1px solid var(--line);
}
.ac-item:last-child{border-bottom:none}
.ac-item[aria-selected="true"],.ac-item:hover{background:var(--panel2)}
.ac-name{font-weight:600;color:var(--tx);white-space:nowrap}
.ac-item mark{background:none;color:var(--link);font-weight:700}
.ac-code{color:var(--tx3);font-size:10.5px}
.ac-ind{color:var(--tx3);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-n{margin-left:auto;padding-left:8px;color:var(--tx2);font-size:10.5px;font-weight:600;white-space:nowrap}
.ac-empty{padding:8px;color:var(--tx3);font-size:11px;line-height:1.6}

/* 고른 종목·검색어 칩 줄 */
.selbar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:0 0 10px}
.selchip{
  display:inline-flex;align-items:center;gap:5px;padding:2px 3px 2px 8px;border-radius:2px;
  font-size:11px;font-weight:600;background:var(--panel2);border:1px solid var(--link);color:var(--tx);
}
.selchip .c{color:var(--tx3);font-weight:600}
.selchip .x{border:0;background:none;font-size:13px;line-height:1;color:var(--tx3);padding:0 4px}
.selchip .x:hover{color:var(--tx)}

/* ---------- 표 ----------
   .tbw 는 좁은 화면에서만 가로 스크롤 컨테이너가 된다.
   넓은 화면에서 overflow 를 걸면 th 의 sticky 기준이 표 자신으로 바뀌어 헤더가 밀린다. */
table{width:100%;border-collapse:collapse;min-width:980px}
th,td{padding:3px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:11.5px}
th{
  background:var(--panel2);color:var(--tx2);font-size:11px;font-weight:600;white-space:nowrap;
  position:sticky;top:var(--hh);z-index:2;
}
td{vertical-align:top}
th.num,td.num{text-align:right;white-space:nowrap}
th.date,td.date{white-space:nowrap;color:var(--tx3)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--tx)}
th .arrow{color:var(--link);font-size:9px}
tbody tr:hover{background:var(--panel2)}
tr:last-child td{border-bottom:none}
.stock{color:var(--link);font-weight:600}
tr:hover .stock{color:var(--link-h)}
.code{color:var(--tx3);font-size:10.5px;margin-left:5px;font-variant-numeric:tabular-nums}
.title{color:var(--tx)}
.title:hover{color:var(--link-h)}
.ind{display:block;color:var(--tx3);font-size:10.5px;margin-top:1px}
.sub{display:block;color:var(--tx3);font-size:10.5px;margin-top:1px}
.badge{
  display:inline-block;min-width:38px;text-align:center;padding:0 5px;border-radius:2px;
  font-size:10.5px;font-weight:700;letter-spacing:.3px;color:#fff;
}
.badge.BUY{background:var(--up-bg)}
.badge.SELL{background:var(--down-bg)}
.badge.HOLD{background:var(--line2)}
.badge.NR{background:transparent;border:1px solid var(--line2);color:var(--tx3)}
.tgt-up{color:var(--up);font-size:10px;font-weight:700;margin-left:3px}
.tgt-down{color:var(--down);font-size:10px;font-weight:700;margin-left:3px}
.tgt-new{color:var(--link);font-size:9.5px;font-weight:700;margin-left:3px;letter-spacing:.3px}
.gapv{display:inline-block;padding:0 4px;border-radius:2px;font-weight:600;min-width:54px;text-align:right}
.gap-pos{color:var(--up)}
.gap-neg{color:var(--down)}
.chg{display:block;font-size:10px;font-weight:600;margin-top:1px}
.chg-up{color:var(--up)}
.chg-down{color:var(--down)}
.chg-flat{color:var(--tx3)}
.toggle{border:0;background:none;color:var(--tx3);font-size:11px;padding:0 4px}
.toggle:hover{color:var(--link)}
tr.summary-row td{
  background:var(--panel2);color:var(--tx2);font-size:11.5px;line-height:1.65;
  padding:7px 10px 9px;white-space:normal;
}
tr.sec-group>td{background:var(--panel2);font-weight:700}
tr.sec-group,tr.sec-child{cursor:pointer}
tr.sec-child>td:first-child{padding-left:24px}
tr.sec-child>td{color:var(--tx2)}
.ratio{color:var(--tx3);font-size:10.5px;font-weight:600;margin-left:5px}
.mini{
  display:inline-block;min-width:22px;text-align:center;padding:0 4px;border-radius:2px;
  font-size:10.5px;font-weight:700;color:#fff;
}
.mini.BUY{background:var(--up-bg)}
.mini.SELL{background:var(--down-bg)}
.mini.HOLD{background:var(--line2)}
.up-n{color:var(--up);font-weight:700}
.down-n{color:var(--down);font-weight:700}
.empty{padding:34px 12px;text-align:center;color:var(--tx3);font-size:11.5px}
tr.more-row td{padding:9px 6px;text-align:center;background:var(--panel2)}
.morebtn{
  font-size:11.5px;font-weight:700;padding:5px 16px;border:1px solid var(--line2);
  border-radius:3px;background:var(--panel);color:var(--link);
}
.morebtn:hover{border-color:var(--link)}

/* ---------- 히트맵 ---------- */
.tmap{position:relative;width:100%;height:560px;background:var(--panel2);overflow:hidden}
.tsec{position:absolute;border:1px solid var(--panel);overflow:hidden}
.tsec>.sl{
  position:absolute;top:0;left:0;right:0;height:14px;background:var(--panel);
  color:var(--tx2);font-size:9.5px;font-weight:700;padding:0 4px;line-height:14px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tile{
  position:absolute;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:#fff;text-align:center;line-height:1.15;
  border:1px solid rgba(0,0,0,.34);
}
html[data-theme="light"] .tile{border-color:rgba(255,255,255,.34)}
.tile:hover{outline:1px solid #fff;outline-offset:-1px;z-index:5}
.tile .tn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;padding:0 2px}
.tile .tn2{font-weight:400;opacity:.82}
.ttip{
  position:fixed;z-index:300;background:var(--panel);border:1px solid var(--line2);border-radius:3px;
  padding:5px 8px;font-size:11px;pointer-events:none;display:none;min-width:170px;
  box-shadow:var(--shadow);
}
.ttip b{display:block;margin-bottom:3px;font-size:11.5px}
.ttip .r{display:flex;justify-content:space-between;gap:14px}
.ttip .r span:first-child{color:var(--tx3)}
.tlegend{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--tx3)}
.tlegend i{width:16px;height:9px;display:block;border:1px solid rgba(0,0,0,.3)}

/* ---------- 안내·각주 ---------- */
.notice{
  background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--link);
  border-radius:3px;padding:10px 12px;font-size:11.5px;color:var(--tx2);line-height:1.7;
}
.notice code{
  background:var(--panel2);padding:1px 5px;border-radius:2px;color:var(--tx);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;
}
footer{border-top:1px solid var(--line);padding:9px 0 20px;color:var(--tx3);font-size:10.5px;line-height:1.75}
footer a{color:var(--tx2);text-decoration:underline}
footer a:hover{color:var(--link-h)}

@media(max-width:1060px){
  .tbw{overflow-x:auto}
  th{position:static}
}
@media(max-width:768px){
  .wrap{padding:0 8px}
  .hd{gap:6px 10px;padding:5px 0}
  .brand{width:100%}
  .tick{width:100%;flex:none;gap:10px}
  .hd-r{width:100%}
  .upd{white-space:normal}
  nav.tabs button{padding:7px 11px}
  /* 필터는 한 줄에 하나씩 — 가로로 삐져나가지 않게 */
  .row{gap:8px}
  .fl{flex:1 1 100%;min-width:0}
  .fl>.seg,.fl>.chips,.fl>select,.fl>.searchbox,.fl>.dd{width:100%}
  .seg{flex-wrap:wrap}
  .seg button{flex:1}
  select{max-width:100%;width:100%}
  .dd>summary{text-align:center}
  input[type=search]{width:100%}
  .count{white-space:normal}
  .tmap{height:400px}
  .ovw{gap:14px}
  .ovi{min-width:64px}
  .ovi .v{font-size:15px}
}
</style>
</head>
<body>

<header>
 <div class="wrap">
  <div class="hd">
    <div class="brand">리포트 <span>레이더</span></div>
    <div class="tick" id="tick">
      <div class="t"><span class="n">KOSPI</span><b id="tKospi">-</b><span class="num" id="tKospiC"></span></div>
      <div class="t"><span class="n">KOSDAQ</span><b id="tKosdaq">-</b><span class="num" id="tKosdaqC"></span></div>
      <span class="mkb" id="mkb">장외</span>
    </div>
    <div class="hd-r">
      <span class="upd" id="updated"></span>
      <button type="button" class="btn" id="themeBtn" title="테마 전환" aria-label="테마 전환">☀</button>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button type="button" data-view="reports">리포트</button>
    <button type="button" data-view="stocks">종목별</button>
    <button type="button" data-view="sectors">업종별</button>
    <button type="button" data-view="heat">히트맵</button>
  </nav>
 </div>
</header>

<main class="wrap">

<div id="app" hidden>

  <div class="panel">
    <div class="ptitle">개요 <span class="sub" id="ovSub"></span></div>
    <div class="pbody"><div class="ovw" id="stats"></div></div>
  </div>

  <div class="panel">
    <div class="ptitle">필터
      <span class="sp">
        <span class="count" id="count"></span>
        <button type="button" class="linkbtn" id="reset">필터 초기화</button>
      </span>
    </div>
    <div class="pbody controls">
      <div class="row">
        <div class="fl">
          <span class="k">기간</span>
          <div class="seg" id="periodSeg">
            <button type="button" data-period="1">오늘</button>
            <button type="button" data-period="3">3일</button>
            <button type="button" data-period="7">1주</button>
            <button type="button" data-period="30">1개월</button>
            <button type="button" data-period="all">전체</button>
          </div>
        </div>

        <div class="fl">
          <span class="k">레이팅</span>
          <div class="chips">
            <button type="button" class="chip r-BUY" data-rating="BUY">BUY</button>
            <button type="button" class="chip r-HOLD" data-rating="HOLD">HOLD</button>
            <button type="button" class="chip r-SELL" data-rating="SELL">SELL</button>
            <button type="button" class="chip r-NR" data-rating="NR">NR</button>
          </div>
        </div>

        <div class="fl">
          <span class="k">목표가</span>
          <div class="chips">
            <button type="button" class="chip" data-change="up">상향</button>
            <button type="button" class="chip" data-change="down">하향</button>

function todayISO(){

function hex2rgb(h){
  h = (h || "#414554").replace("#","");
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var n = parseInt(h, 16);
  if(isNaN(n)) return [65,69,84];
  return [(n>>16)&255, (n>>8)&255, n&255];
}
/* t: -1(하) ~ 0(중립) ~ +1(상). null 이면 중립색 */

  return "rgb(" + out.join(",") + ")";
}

/* ------------------------------------------------ JSONP (네이버)
   fetch()는 CORS에 막히므로 script 태그로 받는다.
   큐 + 요청 간 150ms + 8초 타임아웃. 응답은 EUC-KR. */
var JSONP = (function(){
  var seq = 0, queue = [], busy = false, lastAt = 0;
  var GAP = 150, TIMEOUT = 8000;
  function run(){
    if(busy || !queue.length) return;
    var wait = Math.max(0, GAP - (Date.now() - lastAt));
    busy = true;
    setTimeout(function(){
      var job = queue.shift(); lastAt = Date.now();
      exec(job, function(){ busy = false; run(); });
    }, wait);
  }
  function exec(job, done){
    var name = "__jsonp_cb_" + (++seq) + "_" + (Date.now() % 100000);
    var script = document.createElement("script");
    var timer = null, finished = false;
    function cleanup(){
      if(timer) clearTimeout(timer);
      try{ delete window[name]; }catch(e){ window[name] = undefined; }
      if(script.parentNode) script.parentNode.removeChild(script);
    }
    function finish(err, data){
      if(finished) return;
      finished = true; cleanup(); done();
      if(err) job.reject(err); else job.resolve(data);
    }
    window[name] = function(data){ finish(null, data); };
    script.src = job.url + (job.url.indexOf("?") < 0 ? "?" : "&") + "_callback=" + name;
    script.charset = "EUC-KR";
    script.onerror = function(){ finish(new Error("JSONP 요청 실패")); };
    timer = setTimeout(function(){ finish(new Error("JSONP 타임아웃")); }, TIMEOUT);
    document.head.appendChild(script);
  }
  return function(url){
    return new Promise(function(resolve, reject){
      queue.push({url:url, resolve:resolve, reject:reject}); run();
    });
  };
})();

/* ------------------------------------------------ 실시간 시세
   데이터 파일의 price/gap 은 수집 시점 종가다. 표에 보이는 종목만 네이버에서
   현재가를 받아 덮어쓴다. */
var QUOTE_URL = "https://polling.finance.naver.com/api/realtime?query=";
var QUOTE_CHUNK = 100;      // 한 요청에 담는 종목 수
var LIVE_TTL = 60000;       // 캐시 유효 60초
var QUOTE_INTERVAL = 60000; // 시세 재조회 주기
var DATA_INTERVAL = 300000; // 리포트 갱신 확인 주기 (5분)

var liveCache = Object.create(null);  // code -> {price, changePct, marketState, at}
var inflight = Object.create(null);   // 같은 코드를 중복 요청하지 않게
var live = {ok:false, at:0, fails:0, stopped:false};
var indexes = {KOSPI:null, KOSDAQ:null};

function effPrice(r){
  return (typeof r.livePrice === "number" && r.livePrice > 0) ? r.livePrice : r.price;
}
function effGap(r){
  if(typeof r.livePrice === "number" && r.livePrice > 0){
    if(typeof r.target !== "number") return null;
    return Math.round((r.target - r.livePrice) / r.livePrice * 10000) / 100;
  }
  return (r.gap === null || r.gap === undefined) ? null : r.gap;
}

/* cr(등락률)은 부호 없이 오고 rf 가 방향을 준다 (4=하한, 5=하락) */
function signedPct(d){
  var rf = String(d.rf);
  var cr = Math.abs(Number(d.cr) || 0);
  return (rf === "4" || rf === "5") ? -cr : cr;
}

function parseQuotes(data){
  var areas = data && data.result && data.result.areas;
  if(!areas || !areas.length) return 0;
  var got = 0;
  for(var a=0;a<areas.length;a++){
    var datas = areas[a].datas || [];
    for(var i=0;i<datas.length;i++){
      var d = datas[i];
      if(!d || !d.cd) continue;
      var price = Number(d.nv);
      if(!price) continue;
      liveCache[d.cd] = {
        price: price,
        changePct: signedPct(d),
        marketState: d.ms || "",
        at: Date.now()
      };
      got++;
    }
  }
  return got;
}

function fetchQuotes(codes){
  var jobs = [];
  for(var i=0;i<codes.length;i+=QUOTE_CHUNK){
    var q = "SERVICE_ITEM:" + codes.slice(i, i + QUOTE_CHUNK).join(",");
    jobs.push(JSONP(QUOTE_URL + encodeURIComponent(q)));
  }
  return Promise.all(jobs);
}

function applyLive(){
  for(var i=0;i<reports.length;i++){
    var r = reports[i];
    var e = r.code ? liveCache[r.code] : null;
    if(!e) continue;
    r.livePrice = e.price;
    r.liveChangePct = e.changePct;
    r.marketState = e.marketState;
  }
}

/* 지금 표에 보이는 종목 중 캐시가 없거나 낡은 것만 조회한다 */
function refreshQuotes(){
  if(live.stopped || !reports.length) return;
  var rows = filtered(), seen = Object.create(null), codes = [], now = Date.now();
  for(var i=0;i<rows.length;i++){
    var c = rows[i].code;
    if(!c || seen[c]) continue;
    seen[c] = 1;
    if(inflight[c]) continue;
    var e = liveCache[c];
    if(e && now - e.at < LIVE_TTL) continue;
    codes.push(c);
  }
  if(!codes.length) return;
  codes.forEach(function(c){ inflight[c] = 1; });

  fetchQuotes(codes).then(function(list){
    codes.forEach(function(c){ delete inflight[c]; });
    var got = 0;
    list.forEach(function(d){ got += parseQuotes(d); });
    live.fails = 0;
    if(got){
      live.ok = true;
      live.at = Date.now();
      applyLive();
      renderKeepScroll();
    }
    renderUpdated();
  }).catch(function(err){
    codes.forEach(function(c){ delete inflight[c]; });
    live.fails++;
    console.warn("[리포트 레이더] 시세 조회 실패:", err && err.message ? err.message : err);
    if(live.fails >= 3){
      live.stopped = true;
      console.warn("[리포트 레이더] 시세 조회가 3회 연속 실패해 자동 갱신을 중단합니다.");
    }
    renderUpdated();
  });
}

var scheduleQuotes = debounce(refreshQuotes, 250);

/* ------------------------------------------------ 지수 티커
   지수의 nv 는 100배 스케일이라 100으로 나눈다. */
function refreshIndex(){
  JSONP(QUOTE_URL + encodeURIComponent("SERVICE_INDEX:KOSPI,KOSDAQ")).then(function(data){
    var areas = data && data.result && data.result.areas;
    if(!areas) return;
    for(var a=0;a<areas.length;a++){
      var datas = areas[a].datas || [];
      for(var i=0;i<datas.length;i++){
        var d = datas[i];
        if(!d || !d.cd) continue;
        var key = String(d.cd).toUpperCase();
        if(!(key in indexes)) continue;
        var v = Number(d.nv);
        if(!v) continue;
        indexes[key] = {value:v/100, pct:signedPct(d), ms:d.ms || ""};
      }
    }
    renderTicker();
  }).catch(function(err){
    console.warn("[리포트 레이더] 지수 조회 실패:", err && err.message ? err.message : err);
  });
}

function renderTicker(){
  ["KOSPI","KOSDAQ"].forEach(function(k){
    var id = k === "KOSPI" ? "Kospi" : "Kosdaq";
    var v = indexes[k];
    $("t" + id).textContent = v ? fix2(v.value) : "-";
    var c = $("t" + id + "C");
    if(!v){ c.textContent = ""; c.className = "num"; return; }
    c.textContent = pct(v.pct);
    c.className = "num " + (v.pct > 0 ? "gap-pos" : (v.pct < 0 ? "gap-neg" : "muted"));
  });
  var open = inMarketHours();
  var b = $("mkb");
  b.textContent = open ? "장중" : "장외";
  b.className = "mkb" + (open ? " open" : "");
}

function startTimers(){
  // 장중에만 재조회한다. 장외에는 로드 시 1회(종가)로 끝낸다.
  setInterval(function(){
    if(document.hidden || !inMarketHours()) return;
    refreshQuotes();
    refreshIndex();
  }, QUOTE_INTERVAL);
  setInterval(refreshData, DATA_INTERVAL);
}

/* ------------------------------------------------ 리포트 데이터 재확인 */
function refreshData(){
  fetch("data/meta.json", {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("meta.json " + r.status);
    return r.json();
  }).then(function(m){
    if(!m || !m.updated_at) return null;
    if(meta && meta.updated_at === m.updated_at) return null;
    return fetch("data/reports.json", {cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("reports.json " + r.status);
      return r.json();
    }).then(function(list){
      if(!Array.isArray(list)) return;
      meta = m;
      reports = list;
      rebuildBrokers();
      rebuildSectors();
      rebuildStocks();
      applyLive();
      renderBrokerList();
      renderSectorChips();
      renderKeepScroll();   // 스크롤·필터는 그대로 둔 채 다시 그린다
      renderUpdated();
    });
  }).catch(function(err){
    console.warn("[리포트 레이더] 리포트 갱신 확인 실패:", err && err.message ? err.message : err);
  });
}

/* ------------------------------------------------ 필터링 */
function periodFloor(){
  if(state.period === "all") return null;
  var days = parseInt(state.period, 10);
  if(!days || days < 1) days = 1;
  // 데이터가 있는 최신일을 기준으로 삼는다 (주말·휴장일에도 빈 화면이 되지 않게)
  var base = meta && meta.latest_date ? meta.latest_date : todayISO();
  var today = todayISO();
  if(base > today) base = today;
  return shiftISO(base, -(days - 1));
}

/* opts.skipIndustry / opts.skipSector: 그 필터의 선택지를 셀 때만 쓴다 */
function filtered(opts){
  opts = opts || {};
  var floor = periodFloor();
  var q = state.q.trim().toLowerCase();
  var rs = state.ratings, cs = state.changes, bs = state.brokers;
  var cd = state.codes;
  var ss = opts.skipSector ? [] : state.sectors;
  var ind = opts.skipIndustry ? "" : state.industry;
  var out = [];
  for(var i=0;i<reports.length;i++){
    var r = reports[i];
    if(cd.length && cd.indexOf(r.code) < 0) continue;
    if(floor && (r.date || "") < floor) continue;
    if(rs.length && rs.indexOf(r.rating) < 0) continue;
    if(cs.length && cs.indexOf(r.target_change) < 0) continue;
    if(bs.length && bs.indexOf(r.broker) < 0) continue;
    if(ss.length && ss.indexOf(r.sector || UNCLASSIFIED) < 0) continue;
    if(ind && (r.industry || UNCLASSIFIED) !== ind) continue;
    if(q){
      var hay = ((r.name||"") + " " + (r.code||"") + " " + (r.title||"") + " " +
                 (r.broker||"") + " " + (r.analyst||"")).toLowerCase();
      if(hay.indexOf(q) < 0) continue;
    }
    out.push(r);
  }
  return out;
}

function cmpValues(a, b){
  var an = (a === null || a === undefined || a === ""), bn = (b === null || b === undefined || b === "");
  if(an && bn) return 0;
  if(an) return 1;   // 값 없는 행은 방향과 무관하게 뒤로
  if(bn) return -1;
  if(typeof a === "number" && typeof b === "number") return a - b;
  return String(a).localeCompare(String(b), "ko");
}

function sortRows(rows, keys){
  var key = state.sortKey, dir = state.sortDir === "asc" ? 1 : -1;
  var getter = keys[key];
  if(!getter) return rows;
  var withNulls = rows.slice();
  withNulls.sort(function(x, y){
    var a = getter(x), b = getter(y);
    var an = (a === null || a === undefined || a === "");
    var bn = (b === null || b === undefined || b === "");
    if(an !== bn) return an ? 1 : -1;      // 빈 값은 항상 아래
    var c = cmpValues(a, b);
    if(c !== 0) return c * dir;
    // 동점이면 최신순으로 안정화
    return String(y.date||"").localeCompare(String(x.date||""));
  });
  return withNulls;
}

/* ------------------------------------------------ 개요 통계 */
function ovi(k, v, cls, c){
  return '<div class="ovi"><div class="k">' + k + '</div>' +
         '<div class="v ' + (cls || "") + '">' + v + '</div>' +
         (c ? '<div class="c">' + c + '</div>' : "") + '</div>';
}

function renderStats(rows){
  var counts = {BUY:0,HOLD:0,SELL:0,NR:0}, up = 0, down = 0, gapSum = 0, gapN = 0;
  for(var i=0;i<rows.length;i++){
    var r = rows[i];
    if(counts[r.rating] !== undefined) counts[r.rating]++;
    if(r.target_change === "up") up++;
    else if(r.target_change === "down") down++;
    var g = effGap(r);
    if(typeof g === "number"){ gapSum += g; gapN++; }
  }
  var avgGap = gapN ? Math.round(gapSum / gapN * 100) / 100 : null;
  var n = rows.length || 1;
  var html = ovi("리포트", num(rows.length), "", "전체 " + num(reports.length) + "건");
  for(var j=0;j<RATINGS.length;j++){
    var k = RATINGS[j];
    var cls = k === "BUY" ? "u" : (k === "SELL" ? "d" : "");
    html += ovi(k, num(counts[k]), cls, Math.round(counts[k] / n * 100) + "%");
  }
  html += ovi("목표가 상향", num(up), "u");
  html += ovi("하향", num(down), "d");
  html += ovi("평균 괴리율", avgGap === null ? "-" : pct(avgGap),
              avgGap === null ? "" : (avgGap > 0 ? "u" : (avgGap < 0 ? "d" : "")),
              gapN ? num(gapN) + "건 기준" : "");
  $("stats").innerHTML = html;
  $("ovSub").textContent = periodLabel();
}

/* 괴리율: 부호로 색, 크기로 배경 농도 (±50% 포화) */

  return '<span class="gapv ' + cls + '" style="' + bg.slice(1) + '">' + pct(g) + "</span>";
}

function groupByStock(rows){
  var map = Object.create(null);
  for(var i=0;i<rows.length;i++){
    var r = rows[i];
    if(!r.code) continue;
    var g = map[r.code];
    if(!g){
      g = map[r.code] = {code:r.code, name:r.name, industry:null, sector:null,
                         n:0, targets:[], gaps:[],
                         price:null, changePct:null, BUY:0, HOLD:0, SELL:0, NR:0};
    }
    g.n++;
    if(r.name) g.name = r.name;
    if(r.industry){ g.industry = r.industry; g.sector = r.sector; }
    var p = effPrice(r);
    if(p) g.price = p;
    if(typeof r.liveChangePct === "number") g.changePct = r.liveChangePct;
    if(typeof r.target === "number") g.targets.push(r.target);
    var gp = effGap(r);
    if(typeof gp === "number") g.gaps.push(gp);
    if(g[r.rating] !== undefined) g[r.rating]++;
  }
  var out = [];
  for(var code in map){
    var s = map[code];
    if(s.targets.length){
      var sum = 0;
      for(var j=0;j<s.targets.length;j++) sum += s.targets[j];
      s.avg = Math.round(sum / s.targets.length);
      s.max = Math.max.apply(null, s.targets);
      s.min = Math.min.apply(null, s.targets);
    }else{
      s.avg = s.max = s.min = null;
    }
    s.gap = (s.price && s.avg) ? Math.round((s.avg - s.price) / s.price * 10000) / 100 : null;
    out.push(s);
  }
  return out;
}

function newAgg(name, sector){
  return {name:name, sector:sector, n:0, codes:Object.create(null),
          BUY:0, HOLD:0, SELL:0, NR:0, up:0, down:0,
          gapSum:0, gapN:0, last:"", kids:Object.create(null)};
}

function addAgg(g, r){
  g.n++;
  if(r.code) g.codes[r.code] = 1;
  if(g[r.rating] !== undefined) g[r.rating]++;
  if(r.target_change === "up") g.up++;
  else if(r.target_change === "down") g.down++;
  var gp = effGap(r);
  if(typeof gp === "number"){ g.gapSum += gp; g.gapN++; }
  if((r.date || "") > g.last) g.last = r.date || "";
}

function finishAgg(g){
  g.stocks = Object.keys(g.codes).length;
  g.gap = g.gapN ? Math.round(g.gapSum / g.gapN * 100) / 100 : null;
  g.buyRatio = g.n ? Math.round(g.BUY / g.n * 1000) / 10 : null;
  return g;
}

/* 대분류 -> 세부 업종 2단계 집계 */
function groupBySector(rows){
  var map = Object.create(null);
  for(var i=0;i<rows.length;i++){
    var r = rows[i];
    var sname = r.sector || UNCLASSIFIED;
    var iname = r.industry || UNCLASSIFIED;
    var g = map[sname] || (map[sname] = newAgg(sname, sname));
    addAgg(g, r);
    var kid = g.kids[iname] || (g.kids[iname] = newAgg(iname, sname));
    addAgg(kid, r);
  }
  var out = [];
  for(var key in map){
    var group = finishAgg(map[key]);
    group.children = [];
    for(var ik in group.kids) group.children.push(finishAgg(group.kids[ik]));
    out.push(group);
  }
  return out;
}

/* ------------------------------------------------ 히트맵 (squarified treemap) */
function squarify(items, X, Y, W, H){
  var out = [], x = X, y = Y, w = W, h = H;
  var total = items.reduce(function(s, i){ return s + i.value; }, 0);
  if(total <= 0 || w <= 0 || h <= 0) return out;
  var scale = (w*h)/total;
  var rest = items.map(function(i){ return {ref:i.ref, area:i.value*scale}; });
  function worst(row, rowArea, side){
    if(!row.length) return Infinity;
    var mx = -Infinity, mn = Infinity;
    row.forEach(function(r){ if(r.area > mx) mx = r.area; if(r.area < mn) mn = r.area; });
    var s2 = side*side, a2 = rowArea*rowArea;
    return Math.max(s2*mx/a2, a2/(s2*mn));
  }
  while(rest.length && w > 0.5 && h > 0.5){
    var side = Math.min(w, h);
    var row = [], rowArea = 0, best = Infinity;
    while(rest.length){
      var na = rowArea + rest[0].area;
      var r = worst(row.concat([rest[0]]), na, side);
      if(!row.length || r <= best){ best = r; row.push(rest.shift()); rowArea = na; }
      else break;
    }
    var thick = rowArea/side, off = 0;
    row.forEach(function(it){
      var len = it.area/thick;
      if(w >= h) out.push({ref:it.ref, x:x, y:y+off, w:thick, h:len});
      else       out.push({ref:it.ref, x:x+off, y:y, w:len, h:thick});
      off += len;
    });
    if(w >= h){ x += thick; w -= thick; } else { y += thick; h -= thick; }
  }
  return out;
}

/* 색 기준값: 괴리율(±50% 포화) 또는 BUY 비율(0~100%, 50% 중립) */
function heatValue(nd){
  if(state.heatColor === "buy"){
    var ratio = nd.n ? Math.round(nd.BUY / nd.n * 1000) / 10 : null;
    return {t: ratio === null ? null : (ratio - 50) / 50,
            label: ratio === null ? "" : ratio + "%"};
  }
  var g = nd.gap;
  return {t: (g === null || g === undefined) ? null : Math.max(-1, Math.min(1, g/50)),
          label: (g === null || g === undefined) ? "" : pct(g)};
}

function renderLegend(){
  var gap = state.heatColor !== "buy";
  $("lgMin").textContent = gap ? "-50%" : "BUY 0%";
  $("lgMax").textContent = gap ? "+50%" : "100%";
  [-1,-0.5,0,0.5,1].forEach(function(t, i){
    $("lg" + (i+1)).style.background = heatColor(t);
  });
}

function renderHeatmap(rows){
  var box = $("tmap");
  var W = box.clientWidth, H = box.clientHeight;
  box.innerHTML = "";
  heatByCode = Object.create(null);
  renderLegend();

  heatNodes = groupByStock(rows).filter(function(s){ return s.n > 0; });
  heatNodes.forEach(function(s){ heatByCode[s.code] = s; });
  if(!W || !H) return heatNodes.length;
  if(!heatNodes.length){
    box.innerHTML = '<div class="empty">조건에 맞는 리포트가 없습니다.</div>';
    return 0;
  }

  var bySec = Object.create(null);
  heatNodes.forEach(function(nd){
    var key = nd.sector || UNCLASSIFIED;
    (bySec[key] = bySec[key] || []).push(nd);
  });
  var secs = Object.keys(bySec).map(function(name){
    return {ref:name, value:bySec[name].reduce(function(s, i){ return s + i.n; }, 0)};
  }).sort(function(a, b){ return b.value - a.value; });

  squarify(secs, 0, 0, W, H).forEach(function(sr){
    var sd = document.createElement("div");
    sd.className = "tsec";
    sd.style.cssText = "left:" + sr.x + "px;top:" + sr.y + "px;width:" + sr.w + "px;height:" + sr.h + "px";
    var showLabel = sr.h > 36 && sr.w > 56;
    if(showLabel){
      var lb = document.createElement("div");
      lb.className = "sl";
      lb.textContent = sr.ref + " · " + bySec[sr.ref].length;
      sd.appendChild(lb);
    }
    var pad = showLabel ? 14 : 0;
    var list = bySec[sr.ref].slice().sort(function(a, b){ return b.n - a.n; })
      .map(function(nd){ return {ref:nd, value:nd.n}; });

    squarify(list, 0, pad, sr.w, Math.max(0, sr.h - pad)).forEach(function(t){
      var nd = t.ref, hv = heatValue(nd);
      var el = document.createElement("div");
      el.className = "tile";
      el.style.cssText = "left:" + t.x + "px;top:" + t.y + "px;width:" + t.w + "px;height:" + t.h +
                         "px;background:" + heatColor(hv.t);
      el.dataset.cd = nd.code;
      if(t.w > 30 && t.h > 16){
        var big = t.w > 66 && t.h > 34;
        var nm = document.createElement("div");
        nm.className = "tn";
        nm.style.fontSize = (big ? 11 : 9) + "px";
        nm.textContent = nd.name || nd.code;
        el.appendChild(nm);
        if(t.h > 30){
          var cn = document.createElement("div");
          cn.className = "tn2";
          cn.style.fontSize = (big ? 9.5 : 8.5) + "px";
          cn.textContent = nd.n + "건";
          el.appendChild(cn);
        }
        if(hv.label && t.h > 44){
          var pc = document.createElement("div");
          pc.className = "tp";
          pc.style.fontSize = (big ? 10.5 : 8.5) + "px";
          pc.textContent = hv.label;
          el.appendChild(pc);
        }
      }
      sd.appendChild(el);
    });
    box.appendChild(sd);
  });
  return heatNodes.length;
}

function initHeatEvents(){
  var box = $("tmap"), tip = $("ttip");
  function row(k, v){ return '<div class="r"><span>' + k + "</span><span>" + v + "</span></div>"; }

  box.addEventListener("mousemove", function(e){
    var el = e.target.closest(".tile");
    if(!el){ tip.style.display = "none"; return; }
    var nd = heatByCode[el.dataset.cd];
    if(!nd){ tip.style.display = "none"; return; }
    tip.innerHTML =
      "<b>" + esc(nd.name || nd.code) +
      " <span style='color:var(--tx3);font-weight:400'>" + esc(nd.code) + "</span></b>" +
      row("업종", esc((nd.sector || UNCLASSIFIED) + (nd.industry ? " · " + nd.industry : ""))) +
      row("리포트", num(nd.n) + "건") +
      row("BUY/HOLD/SELL", nd.BUY + " / " + nd.HOLD + " / " + nd.SELL) +
      row("평균 목표가", nd.avg ? num(nd.avg) + "원" : "-") +
      row("현재가", nd.price ? num(nd.price) + "원" : "-") +
      row("평균 괴리율", nd.gap === null ? "-" :
          '<span class="' + (nd.gap > 0 ? "gap-pos" : "gap-neg") + '">' + pct(nd.gap) + "</span>");
    tip.style.display = "block";
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    var x = e.clientX + 14, y = e.clientY + 14;
    if(x + tw > window.innerWidth - 6) x = e.clientX - tw - 14;
    if(y + th > window.innerHeight - 6) y = e.clientY - th - 14;
    tip.style.left = Math.max(4, x) + "px";
    tip.style.top = Math.max(4, y) + "px";
  });
  box.addEventListener("mouseleave", function(){ tip.style.display = "none"; });
  box.addEventListener("click", function(e){
    var el = e.target.closest(".tile");
    if(!el) return;
    tip.style.display = "none";
    gotoStock(el.dataset.cd);
  });

  $("heatSeg").addEventListener("click", function(e){
    var b = e.target.closest("button[data-hc]");
    if(!b) return;
    state.heatColor = b.dataset.hc;
    render(true);
  });
}

/* ------------------------------------------------ 전체 렌더
   keepLimit: "더 보기"로 늘려 둔 행 수를 그대로 둔다. 필터가 바뀔 때는 넘기지 않는다. */
function render(keepLimit){
  if(!keepLimit) reportLimit = PAGE;
  var rows = filtered();
  renderStats(rows);
  renderSelbar();

  var heat = state.view === "heat";
  $("tablePanel").hidden = heat;
  $("heatPanel").hidden = !heat;

  var shown, count;
  if(heat){
    shown = renderHeatmap(rows);
    count = "종목 " + num(shown) + "개 / 리포트 " + num(rows.length) + "건";
  }else if(state.view === "sectors"){
    $("tableTitle").textContent = "업종별";
    shown = renderSectorView(rows);
    count = "업종 " + num(shown) + "개 / 리포트 " + num(rows.length) + "건";
  }else if(state.view === "stocks"){
    $("tableTitle").textContent = "종목별";
    shown = renderStocks(rows);
    count = "종목 " + num(shown) + "개 / 리포트 " + num(rows.length) + "건";
  }else{
    $("tableTitle").textContent = "리포트";
    renderReports(rows);
    shown = rows.length;
    count = num(rows.length) + "건 / 전체 " + num(reports.length) + "건";
  }
  $("count").textContent = count;
  $("count2").textContent = count;

  if(!heat){
    var em = $("empty");
    if(shown === 0){
      // 종목을 골랐는데 기간에 걸려 비었다면 기간을 넓힐 길을 열어 준다
      if(state.codes.length && state.period !== "all"){
        em.innerHTML = "이 기간엔 리포트가 없습니다 · " +
          '<button type="button" class="linkbtn" id="allPeriod">전체 기간 보기</button>';
      }else{
        em.textContent = "조건에 맞는 리포트가 없습니다.";
      }
    }
    em.hidden = shown > 0;
    $("table").hidden = shown === 0;
  }

  syncControls();
  saveState();
  // 새로 보이게 된 종목이 있으면 그것만 추가로 조회한다
  scheduleQuotes();
}

/* 스크롤 위치를 지킨 채 다시 그린다 (시세·리포트 자동 갱신용) */

function syncControls(){

/* ------------------------------------------------ 업종 컨트롤 */
function rebuildSectors(){
  allSectors = SECTORS.slice();
  // 업종이 안 붙은 리포트가 있으면 그것도 고를 수 있게 칩을 하나 더 둔다
  for(var i=0;i<reports.length;i++){
    if(!reports[i].sector){ allSectors.push(UNCLASSIFIED); break; }
  }
  state.sectors = state.sectors.filter(function(s){ return allSectors.indexOf(s) >= 0; });
}

function renderSectorChips(){
  var html = [];
  for(var i=0;i<allSectors.length;i++){
    var s = allSectors[i];
    html.push('<button type="button" class="chip" data-sector="' + esc(s) + '">' + esc(s) + "</button>");
  }
  $("sectorChips").innerHTML = html.join("");
}

/* 세부 업종 목록은 지금 기간·필터 안에 실제로 있는 업종만, 건수와 함께 보여준다 */
function renderIndustrySelect(){
  var rows = filtered({skipIndustry:true});
  var counts = Object.create(null);
  for(var i=0;i<rows.length;i++){
    var k = rows[i].industry || UNCLASSIFIED;
    counts[k] = (counts[k] || 0) + 1;
  }
  var names = Object.keys(counts).sort(function(a, b){
    return counts[b] - counts[a] || a.localeCompare(b, "ko");
  });
  // 고른 업종이 지금 조건에 하나도 없더라도 선택 상태는 보여 준다
  if(state.industry && counts[state.industry] === undefined) names.unshift(state.industry);

  var html = ['<option value="">세부 업종 전체</option>'];
  for(var j=0;j<names.length;j++){
    html.push('<option value="' + esc(names[j]) + '">' + esc(names[j]) +
              " (" + num(counts[names[j]] || 0) + ")</option>");
  }
  var sel = $("industrySel");
  sel.innerHTML = html.join("");
  sel.value = state.industry || "";
  sel.className = state.industry ? "on" : "";
}

/* ------------------------------------------------ 검색 자동완성
   타이핑 중에는 표를 다시 그리지 않고 이 드롭다운만 갱신한다. */
var AC_STOCKS = 12, AC_BROKERS = 5;

/* 코드 기준 유일한 종목 목록. 리포트 수는 필터와 무관하게 전체 기간 기준이다 */
function rebuildStocks(){
  var map = Object.create(null), code;
  for(var i=0;i<reports.length;i++){
    var r = reports[i];
    if(!r.code) continue;
    var s = map[r.code];
    if(!s) s = map[r.code] = {code:r.code, name:r.name || r.code, industry:"", n:0};
    s.n++;
    if(r.name) s.name = r.name;
    if(r.industry) s.industry = r.industry;
  }
  stockByCode = map;
  stockIndex = [];
  for(code in map){
    var st = map[code];
    st.nameNorm = norm(st.name);
    st.codeNorm = norm(st.code);
    stockIndex.push(st);
  }
  stockIndex.sort(function(a, b){ return b.n - a.n || a.name.localeCompare(b.name, "ko"); });
}

/* 입력값과 겹치는 부분만 강조한다. 공백을 지운 비교값으로는 위치를 못 잡으므로
   원문에서 그대로 찾히는 경우에만 표시한다. */
function hilite(text, raw){
  var t = String(text === null || text === undefined ? "" : text);
  var i = raw ? t.toLowerCase().indexOf(raw) : -1;
  if(i < 0) return esc(t);
  return esc(t.slice(0, i)) + "<mark>" + esc(t.slice(i, i + raw.length)) + "</mark>" +
         esc(t.slice(i + raw.length));
}

function acCandidates(input){
  var qn = norm(input);
  var out = {stocks:[], brokers:[], raw:input.trim().toLowerCase()};
  if(!qn) return out;

  var hits = [];
  for(var i=0;i<stockIndex.length;i++){
    var s = stockIndex[i];
    var byName = s.nameNorm.indexOf(qn), byCode = s.codeNorm.indexOf(qn);
    if(byName < 0 && byCode < 0) continue;
    // 이름 앞부분 일치를 가장 위로, 그다음 코드 앞부분, 나머지는 부분일치
    hits.push({s:s, rank: byName === 0 ? 0 : (byCode === 0 ? 1 : 2)});
  }
  hits.sort(function(a, b){
    return a.rank - b.rank || b.s.n - a.s.n || a.s.name.localeCompare(b.s.name, "ko");
  });
  for(var j=0;j<hits.length && out.stocks.length < AC_STOCKS;j++) out.stocks.push(hits[j].s);

  for(var k=0;k<allBrokers.length && out.brokers.length < AC_BROKERS;k++){
    if(norm(allBrokers[k]).indexOf(qn) >= 0) out.brokers.push(allBrokers[k]);
  }
  return out;
}

function renderAc(){
  var input = $("q").value;
  var c = acCandidates(input);
  var html = [], n = 0, i;
  acItems = [];

  if(c.stocks.length){
    html.push('<div class="ac-sec" aria-hidden="true">종목</div>');
    for(i=0;i<c.stocks.length;i++){
      var s = c.stocks[i];
      acItems.push({kind:"stock", value:s.code});
      html.push('<div class="ac-item" role="option" id="ac-opt-' + n + '" data-i="' + n +
                '" aria-selected="false">' +
                '<span class="ac-name">' + hilite(s.name, c.raw) + "</span>" +
                '<span class="ac-code">' + hilite(s.code, c.raw) + "</span>" +
                (s.industry ? '<span class="ac-ind">' + esc(s.industry) + "</span>" : "") +
                '<span class="ac-n">' + num(s.n) + "건</span></div>");
      n++;
    }
  }
  if(c.brokers.length){
    html.push('<div class="ac-sec" aria-hidden="true">증권사</div>');
    for(i=0;i<c.brokers.length;i++){
      var b = c.brokers[i];
      acItems.push({kind:"broker", value:b});
      html.push('<div class="ac-item" role="option" id="ac-opt-' + n + '" data-i="' + n +
                '" aria-selected="false">' +
                '<span class="ac-name">' + hilite(b, c.raw) + "</span></div>");
      n++;
    }
  }
  if(!n){
    html.push('<div class="ac-empty">일치하는 종목·증권사가 없습니다.<br>' +
              "Enter 를 누르면 제목까지 텍스트로 찾습니다.</div>");
  }

  $("ac").innerHTML = html.join("");
  acIndex = -1;
  $("q").removeAttribute("aria-activedescendant");
  setAcOpen(!!input.trim());
}

function setAcOpen(on){
  acOpen = !!on;
  $("ac").hidden = !acOpen;
  $("q").setAttribute("aria-expanded", acOpen ? "true" : "false");
  if(!acOpen){
    acIndex = -1;
    $("q").removeAttribute("aria-activedescendant");
  }
}
function closeAc(){ setAcOpen(false); }

function moveAc(delta){
  if(!acOpen || !acItems.length) return;
  var panel = $("ac");
  var prev = panel.querySelector('.ac-item[aria-selected="true"]');
  if(prev) prev.setAttribute("aria-selected", "false");
  acIndex += delta;
  if(acIndex < 0) acIndex = acItems.length - 1;
  if(acIndex >= acItems.length) acIndex = 0;
  var el = panel.querySelector('.ac-item[data-i="' + acIndex + '"]');
  if(!el) return;
  el.setAttribute("aria-selected", "true");
  $("q").setAttribute("aria-activedescendant", el.id);
  if(el.scrollIntoView) el.scrollIntoView({block:"nearest"});
}

function pickAc(i){
  var it = acItems[i];
  if(!it) return;
  $("q").value = "";
  closeAc();
  if(it.kind === "stock"){
    if(state.codes.indexOf(it.value) < 0) state.codes.push(it.value);
  }else{
    if(state.brokers.indexOf(it.value) < 0) state.brokers.push(it.value);
    renderBrokerList();
  }
  render();
  $("q").focus();
}

/* 드롭다운에서 아무것도 고르지 않고 Enter: 예전처럼 자유 텍스트로 거른다 */
function commitText(){
  var v = $("q").value.trim();
  closeAc();
  if(!v) return;
  state.q = v;
  $("q").value = "";
  render();
}

function renderSelbar(){
  var html = [], i;
  for(i=0;i<state.codes.length;i++){
    var code = state.codes[i];
    var s = stockByCode[code];
    var label = s ? s.name : code;
    html.push('<span class="selchip">' + esc(label) +
              '<span class="c">' + esc(code) + "</span>" +
              '<button type="button" class="x" data-uncode="' + esc(code) +
              '" aria-label="' + esc(label) + ' 선택 해제">×</button></span>');
  }
  if(state.q){
    html.push('<span class="selchip">제목 검색: ‘' + esc(state.q) + '’' +
              '<button type="button" class="x" id="unq" aria-label="검색어 지우기">×</button></span>');
  }
  var bar = $("selbar");
  bar.innerHTML = html.join("");
  bar.hidden = !html.length;
}

/* ------------------------------------------------ 이벤트 */
function toggleIn(arr, value){
  var i = arr.indexOf(value);
  if(i >= 0) arr.splice(i, 1); else arr.push(value);
}

function bind(){
  $("periodSeg").addEventListener("click", function(e){
    var b = e.target.closest("button[data-period]");
    if(!b) return;
    state.period = b.dataset.period;
    render();
  });

  $("tabs").addEventListener("click", function(e){
    var b = e.target.closest("button[data-view]");
    if(!b) return;
    state.view = b.dataset.view;
    render();
  });

  document.querySelector(".controls").addEventListener("click", function(e){
    var b = e.target.closest("[data-rating],[data-change],[data-sector]");
    if(!b) return;
    if(b.dataset.rating) toggleIn(state.ratings, b.dataset.rating);
    else if(b.dataset.change) toggleIn(state.changes, b.dataset.change);
    else toggleIn(state.sectors, b.dataset.sector);
    render();
  });

  $("industrySel").addEventListener("change", function(){
    state.industry = $("industrySel").value;
    render();
  });

  // 타이핑은 드롭다운만 건드린다. 표는 항목을 고르거나 Enter 를 쳤을 때만 다시 그린다.
  var acDebounced = debounce(renderAc, 120);
  $("q").addEventListener("input", function(){
    if(!$("q").value.trim()){ closeAc(); return; }
    acDebounced();
  });
  $("q").addEventListener("focus", function(){
    if($("q").value.trim()) renderAc();
  });
  $("q").addEventListener("keydown", function(e){
    if(e.key === "ArrowDown"){
      e.preventDefault();
      if(!acOpen && $("q").value.trim()) renderAc();
      moveAc(1);
    }else if(e.key === "ArrowUp"){
      e.preventDefault();
      moveAc(-1);
    }else if(e.key === "Enter"){
      e.preventDefault();
      if(acOpen && acIndex >= 0) pickAc(acIndex);
      else commitText();
    }else if(e.key === "Escape"){
      if(acOpen){ e.preventDefault(); closeAc(); }
    }else if(e.key === "Backspace"){
      // 빈 입력창에서 지우면 마지막으로 고른 종목이 빠진다
      if(!$("q").value && state.codes.length){
        e.preventDefault();
        state.codes.pop();
        closeAc();
        render();
      }
    }
  });
  // click 이 오기 전에 처리해야 입력창의 포커스가 먼저 빠지지 않는다
  $("ac").addEventListener("mousedown", function(e){
    var it = e.target.closest(".ac-item");
    if(!it) return;
    e.preventDefault();
    pickAc(Number(it.dataset.i));
  });

  $("selbar").addEventListener("click", function(e){
    var x = e.target.closest("[data-uncode]");
    if(x){
      var i = state.codes.indexOf(x.dataset.uncode);
      if(i >= 0) state.codes.splice(i, 1);
      render();
      return;
    }
    if(e.target.closest("#unq")){ state.q = ""; render(); }
  });

  $("empty").addEventListener("click", function(e){
    if(!e.target.closest("#allPeriod")) return;
    state.period = "all";
    render();
  });

  $("reset").addEventListener("click", function(){
    state.ratings = []; state.changes = []; state.brokers = [];
    state.sectors = []; state.industry = ""; state.codes = [];
    state.q = ""; $("q").value = "";
    state.period = "7"; state.sortKey = "date"; state.sortDir = "desc";
    closeAc();
    renderBrokerList();
    render();
  });

  $("themeBtn").addEventListener("click", function(){
    applyTheme(currentTheme() === "dark" ? "light" : "dark");
    if(state.view === "heat") render(true);
  });

  $("thead").addEventListener("click", function(e){
    var th = e.target.closest("th[data-sort]");
    if(!th) return;
    var key = th.dataset.sort;
    if(state.sortKey === key){
      state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
    }else{
      state.sortKey = key;
      // 이름·증권사는 가나다순이 자연스럽고, 수치는 큰 값부터가 자연스럽다
      state.sortDir = (key === "name" || key === "broker") ? "asc" : "desc";
    }
    render();
  });
  $("thead").addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){
      var th = e.target.closest("th[data-sort]");
      if(th){ e.preventDefault(); th.click(); }
    }
  });

  $("tbody").addEventListener("click", function(e){
    if(e.target.closest("#moreBtn")){
      reportLimit += PAGE;
      renderKeepScroll();
      return;
    }
    var b = e.target.closest("button[data-summary]");
    if(b){
      var id = b.dataset.summary;
      if(openSummaries[id]) delete openSummaries[id];
      else openSummaries[id] = true;
      render(true);
      return;
    }
    // 업종별 탭: 화살표는 접기/펼치기, 나머지 자리는 그 업종으로 이동
    var caret = e.target.closest("button[data-secopen]");
    if(caret){
      var key = caret.dataset.secopen;
      if(openSectors[key]) delete openSectors[key];
      else openSectors[key] = true;
      renderKeepScroll();
      return;
    }
    var tr = e.target.closest("tr[data-sec]");
    if(tr) gotoSector(tr.dataset.sec, tr.dataset.ind);
  });

  $("brokerAll").addEventListener("click", function(){
    state.brokers = allBrokers.slice();
    renderBrokerList(); render();
  });
  $("brokerNone").addEventListener("click", function(){
    state.brokers = [];
    renderBrokerList(); render();
  });
  $("brokerList").addEventListener("change", function(e){
    var cb = e.target;
    if(cb.type !== "checkbox") return;
    toggleIn(state.brokers, cb.value);
    render();
  });

  initHeatEvents();

  // 드롭다운 바깥을 누르면 닫는다
  var searchbox = document.querySelector(".searchbox");
  document.addEventListener("click", function(e){
    var dd = $("brokerDd");
    if(dd.open && !dd.contains(e.target)) dd.open = false;
    if(acOpen && !searchbox.contains(e.target)) closeAc();
  });

  window.addEventListener("resize", debounce(function(){
    setHeaderVar();
    if(state.view === "heat") render(true);
  }, 180));
}

function rebuildBrokers(){
  if(meta && Array.isArray(meta.brokers) && meta.brokers.length){
    allBrokers = meta.brokers.slice();
  }else{
    var set = Object.create(null);
    reports.forEach(function(r){ if(r.broker) set[r.broker] = 1; });
    allBrokers = Object.keys(set).sort(function(a,b){ return a.localeCompare(b, "ko"); });
  }
  // 사라진 증권사가 필터에 남아 있으면 걷어낸다
  state.brokers = state.brokers.filter(function(b){ return allBrokers.indexOf(b) >= 0; });
}

function renderBrokerList(){
  var html = [];
  for(var i=0;i<allBrokers.length;i++){
    var b = allBrokers[i];
    var on = state.brokers.indexOf(b) >= 0;
    html.push('<label><input type="checkbox" value="' + esc(b) + '"' +
              (on ? " checked" : "") + "> " + esc(b) + "</label>");
  }
  $("brokerList").innerHTML = html.join("");
}

/* ------------------------------------------------ 부팅 */
function showNotice(html){
  var n = $("notice");
  n.innerHTML = html;
  n.hidden = false;
}

function boot(){
  applyTheme(currentTheme());
  setHeaderVar();
  renderTicker();
  loadState();
  // 예전 버전이 남긴 값이나 손댄 저장소로 정렬이 깨지지 않게 한 번 걸러준다
  var VALID_SORT = ["date","name","broker","rating","target","price","gap","n","avg","max","min",
                    "industry","stocks","buy","up","last"];
  if(VALID_SORT.indexOf(state.sortKey) < 0) state.sortKey = "date";
  if(state.sortDir !== "asc" && state.sortDir !== "desc") state.sortDir = "desc";
  if(VIEWS.indexOf(state.view) < 0) state.view = "reports";
  if(state.heatColor !== "buy") state.heatColor = "gap";
  if(!Array.isArray(state.ratings)) state.ratings = [];
  if(!Array.isArray(state.changes)) state.changes = [];
  if(!Array.isArray(state.brokers)) state.brokers = [];
  if(!Array.isArray(state.sectors)) state.sectors = [];
  if(typeof state.industry !== "string") state.industry = "";
  if(typeof state.q !== "string") state.q = "";
  if(!Array.isArray(state.codes)) state.codes = [];
  state.codes = state.codes.filter(function(c){ return typeof c === "string" && c; });
  // 확정된 검색어는 칩으로 보여 주므로 입력창은 늘 비워 둔다
  $("q").value = "";
  // 업종별 탭은 처음엔 다 펼쳐 둔다 (접은 상태는 저장하지 않는다)
  SECTORS.concat([UNCLASSIFIED]).forEach(function(s){ openSectors[s] = true; });

  Promise.all([
    fetch("data/reports.json", {cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("reports.json " + r.status);
      return r.json();
    }),
    fetch("data/meta.json", {cache:"no-store"}).then(function(r){
      return r.ok ? r.json() : null;
    }).catch(function(){ return null; })
  ]).then(function(res){
    reports = Array.isArray(res[0]) ? res[0] : [];
    meta = res[1];

    rebuildBrokers();
    rebuildSectors();
    rebuildStocks();
    renderUpdated();

    if(!reports.length){
      showNotice("수집된 리포트가 없습니다. <code>python scraper/collect.py --days 45</code> 를 먼저 실행해 주세요.");
      return;
    }

    renderBrokerList();
    renderSectorChips();
    bind();
    $("app").hidden = false;
    setHeaderVar();
    render();          // 끝에서 scheduleQuotes() 가 첫 시세 조회를 건다
    refreshIndex();
    startTimers();
  }).catch(function(err){
    var isFile = location.protocol === "file:";
    showNotice(
      "<b>데이터를 불러오지 못했습니다.</b><br>" +
      (isFile
        ? "브라우저에서 <code>file://</code> 로 열면 보안 정책 때문에 JSON을 읽을 수 없습니다. " +
          "프로젝트 폴더에서 아래를 실행한 뒤 <code>http://localhost:3491</code> 로 접속하세요.<br>" +
          "<code>python -m http.server 3491</code>"
        : "<code>data/reports.json</code> 을 읽을 수 없습니다. 수집을 먼저 실행했는지 확인하세요.<br>" +
          "<code>python scraper/collect.py --days 45</code>") +
      '<br><span class="muted">' + esc(err && err.message ? err.message : err) + "</span>"
    );
  });
}

boot();
})();
</script>
</body>
</html>
