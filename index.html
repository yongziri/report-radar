<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리포트 레이더</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#fbfbfd; --line:#e3e6ec; --line-2:#eef0f4;
  --fg:#1b1f27; --fg-dim:#5c6472; --fg-faint:#8b93a1;
  --accent:#2f6df0; --accent-soft:#e8f0fe;
  --up:#d1343f; --down:#1667d6;
  --buy:#0f8a4c; --buy-bg:#e4f5eb; --hold:#5c6472; --hold-bg:#eceef2;
  --sell:#c2303a; --sell-bg:#fceaec; --nr:#98a0ae; --nr-bg:#f2f3f6;
  --shadow:0 1px 2px rgba(16,20,30,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1116; --panel:#161a21; --panel-2:#1b1f27; --line:#272d38; --line-2:#20252e;
    --fg:#e6e9ef; --fg-dim:#9aa3b2; --fg-faint:#6b7382;
    --accent:#5b8dfb; --accent-soft:#1c2a45;
    --up:#f2626d; --down:#5b9bfb;
    --buy:#3ecf8e; --buy-bg:#122c22; --hold:#9aa3b2; --hold-bg:#222833;
    --sell:#f2626d; --sell-bg:#2e1a1d; --nr:#6b7382; --nr-bg:#1c2129;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","맑은 고딕",
       "Apple SD Gothic Neo","Noto Sans KR",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1400px;margin:0 auto;padding:18px 16px 48px}

/* ---------- 헤더 ---------- */
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 14px;margin-bottom:14px}
h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.3px}
h1 .dot{color:var(--accent)}
.updated{font-size:12px;color:var(--fg-faint)}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:11.5px;font-weight:600;background:var(--panel);border:1px solid var(--line);
  color:var(--fg-dim);white-space:nowrap;
}
.pill b{font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.pill.buy{background:var(--buy-bg);border-color:transparent;color:var(--buy)}
.pill.buy b{color:var(--buy)}
.pill.hold{background:var(--hold-bg);border-color:transparent;color:var(--hold)}
.pill.hold b{color:var(--hold)}
.pill.sell{background:var(--sell-bg);border-color:transparent;color:var(--sell)}
.pill.sell b{color:var(--sell)}
.pill.nr{background:var(--nr-bg);border-color:transparent;color:var(--nr)}
.pill.nr b{color:var(--nr)}
.pill.up b{color:var(--up)} .pill.down b{color:var(--down)}

/* ---------- 컨트롤 ---------- */
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:9px;
  box-shadow:var(--shadow);
}
.controls{padding:10px 12px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:9px 14px;align-items:center}
.group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.group>.lab{font-size:11px;color:var(--fg-faint);font-weight:600;letter-spacing:.2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel-2)}
.seg button{
  appearance:none;border:0;background:transparent;color:var(--fg-dim);
  padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;
  border-right:1px solid var(--line);
}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--fg);background:var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.chip{
  appearance:none;font-family:inherit;cursor:pointer;
  border:1px solid var(--line);background:var(--panel-2);color:var(--fg-dim);
  padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;
}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.r-BUY[aria-pressed="true"]{background:var(--buy);border-color:var(--buy)}
.chip.r-HOLD[aria-pressed="true"]{background:var(--hold);border-color:var(--hold)}
.chip.r-SELL[aria-pressed="true"]{background:var(--sell);border-color:var(--sell)}
.chip.r-NR[aria-pressed="true"]{background:var(--nr);border-color:var(--nr)}
input[type=search]{
  font-family:inherit;font-size:13px;padding:6px 10px;width:230px;max-width:100%;
  border:1px solid var(--line);border-radius:7px;background:var(--panel-2);color:var(--fg);
}
input[type=search]:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
select{
  font-family:inherit;font-size:12px;font-weight:600;padding:5px 8px;max-width:210px;
  border:1px solid var(--line);border-radius:7px;background:var(--panel-2);color:var(--fg-dim);
}
select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
select.on{color:var(--fg);border-color:var(--accent)}

/* 증권사 드롭다운 */
.dd{position:relative}
.dd>summary{
  list-style:none;cursor:pointer;padding:5px 10px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel-2);font-size:12px;font-weight:600;color:var(--fg-dim);user-select:none;
}
.dd>summary::-webkit-details-marker{display:none}
.dd[open]>summary{border-color:var(--accent);color:var(--fg)}
.dd-panel{
  position:absolute;z-index:30;top:calc(100% + 5px);left:0;width:270px;max-height:320px;
  overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:8px;box-shadow:0 6px 20px rgba(10,14,22,.16);
}
.dd-panel label{display:flex;gap:7px;align-items:center;padding:3px 4px;border-radius:5px;cursor:pointer;font-size:12.5px}
.dd-panel label:hover{background:var(--line-2)}
.dd-actions{display:flex;gap:6px;margin-bottom:6px;position:sticky;top:0;background:var(--panel);padding-bottom:6px}
.dd-actions button{
  flex:1;font-family:inherit;font-size:11.5px;font-weight:600;cursor:pointer;padding:4px;
  border:1px solid var(--line);border-radius:5px;background:var(--panel-2);color:var(--fg-dim);
}
.dd-actions button:hover{color:var(--fg)}
.linkbtn{
  appearance:none;background:none;border:0;font-family:inherit;font-size:12px;
  color:var(--accent);cursor:pointer;padding:4px 2px;font-weight:600;
}
.count{margin-left:auto;font-size:12px;color:var(--fg-faint);font-variant-numeric:tabular-nums}

/* ---------- 표 ---------- */
.tablewrap{overflow-x:auto;border-radius:9px}
table{border-collapse:collapse;width:100%;min-width:940px;background:var(--panel)}
thead th{
  position:sticky;top:0;z-index:5;background:var(--panel);
  border-bottom:1px solid var(--line);text-align:left;
  padding:8px 10px;font-size:11.5px;font-weight:700;color:var(--fg-dim);
  letter-spacing:.2px;white-space:nowrap;
}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--fg)}
thead th .arrow{color:var(--accent);font-size:10px}
tbody td{border-bottom:1px solid var(--line-2);padding:7px 10px;vertical-align:top}
tbody tr:hover{background:var(--panel-2)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.date{color:var(--fg-dim);white-space:nowrap;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline}
.stock{font-weight:600}
.code{color:var(--fg-faint);font-size:11.5px;font-variant-numeric:tabular-nums;margin-left:5px}
.title{color:var(--fg);display:inline}
.title:hover{color:var(--accent)}
/* 종목 셀 아래 붙는 업종명 */
.ind{display:block;color:var(--fg-faint);font-size:11px;margin-top:1px}
.sub{display:block;color:var(--fg-faint);font-size:11.5px;margin-top:1px}
.badge{
  display:inline-block;min-width:44px;text-align:center;padding:2px 7px;border-radius:5px;
  font-size:11px;font-weight:700;letter-spacing:.3px;
}
.badge.BUY{background:var(--buy-bg);color:var(--buy)}
.badge.HOLD{background:var(--hold-bg);color:var(--hold)}
.badge.SELL{background:var(--sell-bg);color:var(--sell)}
.badge.NR{background:var(--nr-bg);color:var(--nr)}
.tgt-up{color:var(--up);font-size:10.5px;font-weight:700;margin-left:3px}
.tgt-down{color:var(--down);font-size:10.5px;font-weight:700;margin-left:3px}
.tgt-new{color:var(--accent);font-size:9.5px;font-weight:700;margin-left:3px;letter-spacing:.3px}
.gap-pos{color:var(--up);font-weight:600}
.gap-neg{color:var(--down);font-weight:600}
/* 현재가 아래 작게 붙는 실시간 등락률 */
.chg{display:block;font-size:10.5px;font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}
.chg-up{color:var(--up)}
.chg-down{color:var(--down)}
.chg-flat{color:var(--fg-faint)}
.strong{font-weight:700}
.muted{color:var(--fg-faint)}
.toggle{
  appearance:none;border:0;background:none;cursor:pointer;color:var(--fg-faint);
  font-size:11px;padding:0 4px;font-family:inherit;
}
.toggle:hover{color:var(--accent)}
tr.summary-row td{
  background:var(--panel-2);color:var(--fg-dim);font-size:12.5px;line-height:1.65;
  padding:9px 14px 12px 14px;border-bottom:1px solid var(--line);
}
/* 업종별 탭: 대분류 행 + 그 아래 세부 업종 행 */
tr.sec-group>td{background:var(--panel-2);font-weight:700;border-bottom:1px solid var(--line)}
tr.sec-group,tr.sec-child{cursor:pointer}
tr.sec-child>td:first-child{padding-left:26px}
tr.sec-child>td{color:var(--fg-dim)}
.ratio{color:var(--fg-faint);font-size:11px;font-weight:600;margin-left:5px}
.mini{display:inline-block;min-width:26px;text-align:center;padding:1px 5px;border-radius:4px;
      font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.mini.BUY{background:var(--buy-bg);color:var(--buy)}
.mini.HOLD{background:var(--hold-bg);color:var(--hold)}
.mini.SELL{background:var(--sell-bg);color:var(--sell)}
.up-n{color:var(--up);font-weight:700}
.down-n{color:var(--down);font-weight:700}
.empty{padding:44px 16px;text-align:center;color:var(--fg-faint)}
.notice{
  padding:18px;border:1px solid var(--line);border-radius:9px;background:var(--panel);
  color:var(--fg-dim);line-height:1.7;
}
.notice code{
  background:var(--line-2);padding:2px 6px;border-radius:4px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--fg);
}
footer{margin-top:16px;font-size:11.5px;color:var(--fg-faint);line-height:1.8}
footer a{color:var(--fg-dim);text-decoration:underline}

@media (max-width:640px){
  .wrap{padding:12px 10px 40px}
  h1{font-size:17px}
  .stats{margin-left:0;width:100%}
  input[type=search]{width:100%}
  .count{margin-left:0}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>리포트 레이더<span class="dot">.</span></h1>
  <span class="updated" id="updated"></span>
  <div class="stats" id="stats"></div>
</header>

<div id="app" hidden>
  <div class="panel controls">
    <div class="group">
      <span class="lab">기간</span>
      <div class="seg" id="periodSeg">
        <button type="button" data-period="1">오늘</button>
        <button type="button" data-period="3">3일</button>
        <button type="button" data-period="7">1주</button>
        <button type="button" data-period="30">1개월</button>
        <button type="button" data-period="all">전체</button>
      </div>
    </div>

    <div class="group">
      <span class="lab">레이팅</span>
      <button type="button" class="chip r-BUY" data-rating="BUY">BUY</button>
      <button type="button" class="chip r-HOLD" data-rating="HOLD">HOLD</button>
      <button type="button" class="chip r-SELL" data-rating="SELL">SELL</button>
      <button type="button" class="chip r-NR" data-rating="NR">NR</button>
    </div>

    <div class="group">
      <span class="lab">목표가</span>
      <button type="button" class="chip" data-change="up">상향</button>
      <button type="button" class="chip" data-change="down">하향</button>
      <button type="button" class="chip" data-change="new">신규</button>
    </div>

    <div class="group" id="sectorChips"></div>

    <div class="group">
      <select id="industrySel" aria-label="세부 업종"></select>
    </div>

    <details class="dd group" id="brokerDd">
      <summary id="brokerSummary">증권사 전체</summary>
      <div class="dd-panel">
        <div class="dd-actions">
          <button type="button" id="brokerAll">전체 선택</button>
          <button type="button" id="brokerNone">전체 해제</button>
        </div>
        <div id="brokerList"></div>
      </div>
    </details>

    <div class="group">
      <input type="search" id="q" placeholder="종목명·코드·제목·증권사 검색" autocomplete="off">
    </div>

    <div class="group">
      <div class="seg" id="viewSeg">
        <button type="button" data-view="reports">리포트</button>
        <button type="button" data-view="stocks">종목별</button>
        <button type="button" data-view="sectors">업종별</button>
      </div>
    </div>

    <button type="button" class="linkbtn" id="reset">필터 초기화</button>
    <span class="count" id="count"></span>
  </div>

  <div class="panel tablewrap">
    <table id="table">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>

    <div class="empty" id="empty" hidden>조건에 맞는 리포트가 없습니다.</div>
  </div>
</div>

<div class="notice" id="notice" hidden></div>

<footer>
  데이터 출처: <a href="https://finance.naver.com/research/company_list.naver" target="_blank" rel="noopener">네이버 금융 리서치</a>,
  <a href="https://consensus.hankyung.com/analysis/list?report_type=CO" target="_blank" rel="noopener">한경 컨센서스</a>,
  <a href="https://rc.kbsec.com/" target="_blank" rel="noopener">KB증권 리서치</a>,
  <a href="https://www.nhsec.com/research/boardList.action?rsh_ppr_dit_cd=01" target="_blank" rel="noopener">NH투자증권 리서치</a>,
  <a href="https://securities.koreainvestment.com/main/research/research/Strategy.jsp?jkGubun=10" target="_blank" rel="noopener">한국투자증권 리서치</a>.
  현재가는 조회 시점의 종가 또는 실시간가 기준입니다.<br>
  이 페이지는 증권사 리포트를 모아 보여줄 뿐이며 투자 권유가 아닙니다. 투자 판단과 그 결과에 대한 책임은 투자자 본인에게 있습니다.
</footer>

</div>

<script>
(function(){
"use strict";

var LS_KEY = "report-radar/state/v1";
var RATINGS = ["BUY","HOLD","SELL","NR"];
var CHANGES = ["up","down","new"];
// 대분류(sector). scraper/sectors.py의 SECTOR_ORDER와 같은 순서다.
var SECTORS = ["IT","헬스케어","금융","산업재","경기소비재","필수소비재",
               "소재","에너지","유틸리티","통신·미디어","기타"];
var UNCLASSIFIED = "미분류";   // industry/sector가 null인 종목을 묶는 이름

var state = {
  period: "7",
  ratings: [],           // 비어 있으면 전체
  changes: [],           // 비어 있으면 전체
  brokers: [],           // 비어 있으면 전체
  sectors: [],           // 대분류. 비어 있으면 전체
  industry: "",          // 세부 업종 하나. 빈 문자열이면 전체
  q: "",
  view: "reports",
  sortKey: "date",
  sortDir: "desc"
};

var reports = [];
var meta = null;
var allBrokers = [];
var allSectors = [];                     // 화면에 그릴 대분류 칩 목록
var openSummaries = Object.create(null);
var openSectors = Object.create(null);   // 업종별 탭에서 펼쳐 둔 대분류

/* ------------------------------------------------ 상태 저장/복원 */
function loadState(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    var saved = JSON.parse(raw);
    if(saved && typeof saved === "object"){
      for(var k in state){
        if(Object.prototype.hasOwnProperty.call(saved, k)) state[k] = saved[k];
      }
    }
  }catch(e){ /* 저장소를 막아둔 브라우저면 기본값으로 간다 */ }
}
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}

/* ------------------------------------------------ 작은 도우미 */
function $(id){ return document.getElementById(id); }

function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function num(n){
  if(n === null || n === undefined || isNaN(n)) return "";
  return Number(n).toLocaleString("ko-KR");
}
function pct(n){
  if(n === null || n === undefined || isNaN(n)) return "";
  return (n > 0 ? "+" : "") + Number(n).toFixed(2) + "%";
}
function debounce(fn, ms){
  var t;
  return function(){
    var args = arguments, self = this;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(self, args); }, ms);
  };
}
function todayISO(){
  // 브라우저 시간대와 무관하게 KST 기준 오늘
  var d = new Date(Date.now() + 9*3600*1000);
  return d.toISOString().slice(0,10);
}
function shiftISO(iso, days){
  var d = new Date(iso + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0,10);
}
function kstClock(ts){
  // 브라우저 시간대와 무관하게 KST 시:분:초
  return new Date(ts + 9*3600*1000).toISOString().slice(11,19);
}
function inMarketHours(){
  // KST 평일 08:30~16:00 (장전 동시호가 포함)
  var d = new Date(Date.now() + 9*3600*1000);
  var day = d.getUTCDay();
  if(day === 0 || day === 6) return false;
  var min = d.getUTCHours()*60 + d.getUTCMinutes();
  return min >= 8*60 + 30 && min <= 16*60;
}

/* ------------------------------------------------ JSONP (네이버)
   fetch()는 CORS에 막히므로 script 태그로 받는다.
   큐 + 요청 간 150ms + 8초 타임아웃. 응답은 EUC-KR. */
var JSONP = (function(){
  var seq = 0, queue = [], busy = false, lastAt = 0;
  var GAP = 150, TIMEOUT = 8000;
  function run(){
    if(busy || !queue.length) return;
    var wait = Math.max(0, GAP - (Date.now() - lastAt));
    busy = true;
    setTimeout(function(){
      var job = queue.shift(); lastAt = Date.now();
      exec(job, function(){ busy = false; run(); });
    }, wait);
  }
  function exec(job, done){
    var name = "__jsonp_cb_" + (++seq) + "_" + (Date.now() % 100000);
    var script = document.createElement("script");
    var timer = null, finished = false;
    function cleanup(){
      if(timer) clearTimeout(timer);
      try{ delete window[name]; }catch(e){ window[name] = undefined; }
      if(script.parentNode) script.parentNode.removeChild(script);
    }
    function finish(err, data){
      if(finished) return;
      finished = true; cleanup(); done();
      if(err) job.reject(err); else job.resolve(data);
    }
    window[name] = function(data){ finish(null, data); };
    script.src = job.url + (job.url.indexOf("?") < 0 ? "?" : "&") + "_callback=" + name;
    script.charset = "EUC-KR";
    script.onerror = function(){ finish(new Error("JSONP 요청 실패")); };
    timer = setTimeout(function(){ finish(new Error("JSONP 타임아웃")); }, TIMEOUT);
    document.head.appendChild(script);
  }
  return function(url){
    return new Promise(function(resolve, reject){
      queue.push({url:url, resolve:resolve, reject:reject}); run();
    });
  };
})();

/* ------------------------------------------------ 실시간 시세
   데이터 파일의 price/gap 은 수집 시점 종가다. 표에 보이는 종목만 네이버에서
   현재가를 받아 덮어쓴다. */
var QUOTE_URL = "https://polling.finance.naver.com/api/realtime?query=";
var QUOTE_CHUNK = 100;      // 한 요청에 담는 종목 수
var LIVE_TTL = 60000;       // 캐시 유효 60초
var QUOTE_INTERVAL = 60000; // 시세 재조회 주기
var DATA_INTERVAL = 300000; // 리포트 갱신 확인 주기 (5분)

var liveCache = Object.create(null);  // code -> {price, changePct, marketState, at}
var inflight = Object.create(null);   // 같은 코드를 중복 요청하지 않게
var live = {ok:false, at:0, fails:0, stopped:false};

function effPrice(r){
  return (typeof r.livePrice === "number" && r.livePrice > 0) ? r.livePrice : r.price;
}
function effGap(r){
  if(typeof r.livePrice === "number" && r.livePrice > 0){
    if(typeof r.target !== "number") return null;
    return Math.round((r.target - r.livePrice) / r.livePrice * 10000) / 100;
  }
  return (r.gap === null || r.gap === undefined) ? null : r.gap;
}

function parseQuotes(data){
  var areas = data && data.result && data.result.areas;
  if(!areas || !areas.length) return 0;
  var datas = areas[0].datas || [], got = 0;
  for(var i=0;i<datas.length;i++){
    var d = datas[i];
    if(!d || !d.cd) continue;
    var price = Number(d.nv);
    if(!price) continue;
    // cr(등락률)은 부호 없이 오고 rf 가 방향을 준다 (4=하한, 5=하락)
    var rf = String(d.rf);
    var cr = Math.abs(Number(d.cr) || 0);
    liveCache[d.cd] = {
      price: price,
      changePct: (rf === "4" || rf === "5") ? -cr : cr,
      marketState: d.ms || "",
      at: Date.now()
    };
    got++;
  }
  return got;
}

function fetchQuotes(codes){
  var jobs = [];
  for(var i=0;i<codes.length;i+=QUOTE_CHUNK){
    var q = "SERVICE_ITEM:" + codes.slice(i, i + QUOTE_CHUNK).join(",");
    jobs.push(JSONP(QUOTE_URL + encodeURIComponent(q)));
  }
  return Promise.all(jobs);
}

function applyLive(){
  for(var i=0;i<reports.length;i++){
    var r = reports[i];
    var e = r.code ? liveCache[r.code] : null;
    if(!e) continue;
    r.livePrice = e.price;
    r.liveChangePct = e.changePct;
    r.marketState = e.marketState;
  }
}

/* 지금 표에 보이는 종목 중 캐시가 없거나 낡은 것만 조회한다 */
function refreshQuotes(){
  if(live.stopped || !reports.length) return;
  var rows = filtered(), seen = Object.create(null), codes = [], now = Date.now();
  for(var i=0;i<rows.length;i++){
    var c = rows[i].code;
    if(!c || seen[c]) continue;
    seen[c] = 1;
    if(inflight[c]) continue;
    var e = liveCache[c];
    if(e && now - e.at < LIVE_TTL) continue;
    codes.push(c);
  }
  if(!codes.length) return;
  codes.forEach(function(c){ inflight[c] = 1; });

  fetchQuotes(codes).then(function(list){
    codes.forEach(function(c){ delete inflight[c]; });
    var got = 0;
    list.forEach(function(d){ got += parseQuotes(d); });
    live.fails = 0;
    if(got){
      live.ok = true;
      live.at = Date.now();
      applyLive();
      renderKeepScroll();
    }
    renderUpdated();
  }).catch(function(err){
    codes.forEach(function(c){ delete inflight[c]; });
    live.fails++;
    console.warn("[리포트 레이더] 시세 조회 실패:", err && err.message ? err.message : err);
    if(live.fails >= 3){
      live.stopped = true;
      console.warn("[리포트 레이더] 시세 조회가 3회 연속 실패해 자동 갱신을 중단합니다.");
    }
    renderUpdated();
  });
}

var scheduleQuotes = debounce(refreshQuotes, 250);

function startTimers(){
  // 장중에만 재조회한다. 장외에는 로드 시 1회(종가)로 끝낸다.
  setInterval(function(){
    if(document.hidden || !inMarketHours()) return;
    refreshQuotes();
  }, QUOTE_INTERVAL);
  setInterval(refreshData, DATA_INTERVAL);
}

/* ------------------------------------------------ 리포트 데이터 재확인 */
function refreshData(){
  fetch("data/meta.json", {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("meta.json " + r.status);
    return r.json();
  }).then(function(m){
    if(!m || !m.updated_at) return null;
    if(meta && meta.updated_at === m.updated_at) return null;
    return fetch("data/reports.json", {cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("reports.json " + r.status);
      return r.json();
    }).then(function(list){
      if(!Array.isArray(list)) return;
      meta = m;
      reports = list;
      rebuildBrokers();
      rebuildSectors();
      applyLive();
      renderBrokerList();
      renderSectorChips();
      renderKeepScroll();   // 스크롤·필터는 그대로 둔 채 다시 그린다
      renderUpdated();
    });
  }).catch(function(err){
    console.warn("[리포트 레이더] 리포트 갱신 확인 실패:", err && err.message ? err.message : err);
  });
}

/* ------------------------------------------------ 필터링 */
function periodFloor(){
  if(state.period === "all") return null;
  var days = parseInt(state.period, 10);
  if(!days || days < 1) days = 1;
  // 데이터가 있는 최신일을 기준으로 삼는다 (주말·휴장일에도 빈 화면이 되지 않게)
  var base = meta && meta.latest_date ? meta.latest_date : todayISO();
  var today = todayISO();
  if(base > today) base = today;
  return shiftISO(base, -(days - 1));
}

/* opts.skipIndustry / opts.skipSector: 그 필터의 선택지를 셀 때만 쓴다 */
function filtered(opts){
  opts = opts || {};
  var floor = periodFloor();
  var q = state.q.trim().toLowerCase();
  var rs = state.ratings, cs = state.changes, bs = state.brokers;
  var ss = opts.skipSector ? [] : state.sectors;
  var ind = opts.skipIndustry ? "" : state.industry;
  var out = [];
  for(var i=0;i<reports.length;i++){
    var r = reports[i];
    if(floor && (r.date || "") < floor) continue;
    if(rs.length && rs.indexOf(r.rating) < 0) continue;
    if(cs.length && cs.indexOf(r.target_change) < 0) continue;
    if(bs.length && bs.indexOf(r.broker) < 0) continue;
    if(ss.length && ss.indexOf(r.sector || UNCLASSIFIED) < 0) continue;
    if(ind && (r.industry || UNCLASSIFIED) !== ind) continue;
    if(q){
      var hay = ((r.name||"") + " " + (r.code||"") + " " + (r.title||"") + " " +
                 (r.broker||"") + " " + (r.analyst||"")).toLowerCase();
      if(hay.indexOf(q) < 0) continue;
    }
    out.push(r);
  }
  return out;
}

function cmpValues(a, b){
  var an = (a === null || a === undefined || a === ""), bn = (b === null || b === undefined || b === "");
  if(an && bn) return 0;
  if(an) return 1;   // 값 없는 행은 방향과 무관하게 뒤로
  if(bn) return -1;
  if(typeof a === "number" && typeof b === "number") return a - b;
  return String(a).localeCompare(String(b), "ko");
}

function sortRows(rows, keys){
  var key = state.sortKey, dir = state.sortDir === "asc" ? 1 : -1;
  var getter = keys[key];
  if(!getter) return rows;
  var withNulls = rows.slice();
  withNulls.sort(function(x, y){
    var a = getter(x), b = getter(y);
    var an = (a === null || a === undefined || a === "");
    var bn = (b === null || b === undefined || b === "");
    if(an !== bn) return an ? 1 : -1;      // 빈 값은 항상 아래
    var c = cmpValues(a, b);
    if(c !== 0) return c * dir;
    // 동점이면 최신순으로 안정화
    return String(y.date||"").localeCompare(String(x.date||""));
  });
  return withNulls;
}

/* ------------------------------------------------ 헤더 통계 */
function renderStats(rows){
  var counts = {BUY:0,HOLD:0,SELL:0,NR:0}, up = 0, down = 0;
  for(var i=0;i<rows.length;i++){
    var r = rows[i];
    if(counts[r.rating] !== undefined) counts[r.rating]++;
    if(r.target_change === "up") up++;
    else if(r.target_change === "down") down++;
  }
  var html = '<span class="pill">리포트 <b>' + num(rows.length) + '</b></span>';
  for(var j=0;j<RATINGS.length;j++){
    var k = RATINGS[j];
    html += '<span class="pill ' + k.toLowerCase() + '">' + k + ' <b>' + num(counts[k]) + '</b></span>';
  }
  html += '<span class="pill up">목표가 상향 <b>' + num(up) + '</b></span>';
  html += '<span class="pill down">하향 <b>' + num(down) + '</b></span>';
  $("stats").innerHTML = html;
}

function renderHead(cols){
  var html = "<tr>";
  for(var i=0;i<cols.length;i++){
    var c = cols[i];
    var sortable = c.sortable !== false;
    var arrow = "";
    if(sortable && state.sortKey === c.key){
      arrow = ' <span class="arrow">' + (state.sortDir === "asc" ? "▲" : "▼") + "</span>";
    }
    html += '<th class="' + (c.cls === "num" ? "num " : "") + (sortable ? "sortable" : "") + '"' +
            (sortable ? ' data-sort="' + c.key + '" tabindex="0" role="button"' : "") +
            '>' + esc(c.label) + arrow + "</th>";
  }
  return html + "</tr>";
}

function targetCell(r){
  if(r.target === null || r.target === undefined) return '<span class="muted">-</span>';
  var mark = "";
  if(r.target_change === "up"){
    mark = '<span class="tgt-up" title="직전 ' + num(r.prev_target) + '원">▲</span>';
  }else if(r.target_change === "down"){
    mark = '<span class="tgt-down" title="직전 ' + num(r.prev_target) + '원">▼</span>';
  }else if(r.target_change === "new"){
    mark = '<span class="tgt-new" title="이 증권사의 첫 목표가">NEW</span>';
  }
  return '<span class="strong">' + num(r.target) + "</span>" + mark;
}

/* 실시간 등락률 꼬리표 (한국식: 상승 빨강 / 하락 파랑) */
function chgTag(p){
  if(typeof p !== "number") return "";
  var cls = p > 0 ? "chg-up" : (p < 0 ? "chg-down" : "chg-flat");
  return '<span class="chg ' + cls + '">' + pct(p) + "</span>";
}
function priceCell(r){
  var p = effPrice(r);
  if(!p) return '<span class="muted">-</span>';
  return num(p) + (typeof r.livePrice === "number" ? chgTag(r.liveChangePct) : "");
}

/* 종목 셀 아래 붙는 업종명. 툴팁에 대분류를 적는다 */
function indTag(r){
  if(!r.industry) return "";
  return '<span class="ind" title="' + esc((r.sector || UNCLASSIFIED) + " · " + r.industry) +
         '">' + esc(r.industry) + "</span>";
}

function gapCell(g){
  if(g === null || g === undefined) return '<span class="muted">-</span>';
  var cls = g > 0 ? "gap-pos" : (g < 0 ? "gap-neg" : "muted");
  // 절대값이 클수록 진하게 (0~60% 구간을 .55~1 불투명도로)
  var op = Math.min(1, 0.55 + Math.abs(g) / 60 * 0.45);
  return '<span class="' + cls + '" style="opacity:' + op.toFixed(2) + '">' + pct(g) + "</span>";
}

/* ------------------------------------------------ 종목별 표 */
function groupByStock(rows){
  var map = Object.create(null);
  for(var i=0;i<rows.length;i++){
    var r = rows[i];
    if(!r.code) continue;
    var g = map[r.code];
    if(!g){
      g = map[r.code] = {code:r.code, name:r.name, industry:null, sector:null,
                         n:0, targets:[], gaps:[],
                         price:null, changePct:null, BUY:0, HOLD:0, SELL:0, NR:0};
    }
    g.n++;
    if(r.name) g.name = r.name;
    if(r.industry){ g.industry = r.industry; g.sector = r.sector; }
    var p = effPrice(r);
    if(p) g.price = p;
    if(typeof r.liveChangePct === "number") g.changePct = r.liveChangePct;
    if(typeof r.target === "number") g.targets.push(r.target);
    var gp = effGap(r);
    if(typeof gp === "number") g.gaps.push(gp);
    if(g[r.rating] !== undefined) g[r.rating]++;
  }
  var out = [];
  for(var code in map){
    var s = map[code];
    if(s.targets.length){
      var sum = 0;
      for(var j=0;j<s.targets.length;j++) sum += s.targets[j];
      s.avg = Math.round(sum / s.targets.length);
      s.max = Math.max.apply(null, s.targets);
      s.min = Math.min.apply(null, s.targets);
    }else{
      s.avg = s.max = s.min = null;
    }
    s.gap = (s.price && s.avg) ? Math.round((s.avg - s.price) / s.price * 10000) / 100 : null;
    out.push(s);
  }
  return out;
}

    html.push('<td class="num strong">' + (s.avg ? num(s.avg) : '<span class="muted">-</span>') + "</td>");

/* ------------------------------------------------ 업종별 표 */
var SECTOR_COLS = [
  {key:"name",   label:"업종", get:function(g){return g.name;}},
  {key:"n",      label:"리포트", cls:"num", get:function(g){return g.n;}},
  {key:"stocks", label:"종목", cls:"num", get:function(g){return g.stocks;}},
  {key:"buy",    label:"BUY/HOLD/SELL", get:function(g){return g.buyRatio;}},
  {key:"up",     label:"목표가 상향/하향", get:function(g){return g.up;}},
  {key:"gap",    label:"평균 괴리율", cls:"num", get:function(g){return g.gap;}},
  {key:"last",   label:"최근 리포트", cls:"date", get:function(g){return g.last;}}
];

function newAgg(name, sector){
  return {name:name, sector:sector, n:0, codes:Object.create(null),
          BUY:0, HOLD:0, SELL:0, NR:0, up:0, down:0,
          gapSum:0, gapN:0, last:"", kids:Object.create(null)};
}

function addAgg(g, r){
  g.n++;
  if(r.code) g.codes[r.code] = 1;
  if(g[r.rating] !== undefined) g[r.rating]++;
  if(r.target_change === "up") g.up++;
  else if(r.target_change === "down") g.down++;
  var gp = effGap(r);
  if(typeof gp === "number"){ g.gapSum += gp; g.gapN++; }
  if((r.date || "") > g.last) g.last = r.date || "";
}

function finishAgg(g){
  g.stocks = Object.keys(g.codes).length;
  g.gap = g.gapN ? Math.round(g.gapSum / g.gapN * 100) / 100 : null;
  g.buyRatio = g.n ? Math.round(g.BUY / g.n * 1000) / 10 : null;
  return g;
}

/* 대분류 -> 세부 업종 2단계 집계 */
function groupBySector(rows){
  var map = Object.create(null);
  for(var i=0;i<rows.length;i++){
    var r = rows[i];
    var sname = r.sector || UNCLASSIFIED;
    var iname = r.industry || UNCLASSIFIED;
    var g = map[sname] || (map[sname] = newAgg(sname, sname));
    addAgg(g, r);
    var kid = g.kids[iname] || (g.kids[iname] = newAgg(iname, sname));
    addAgg(kid, r);
  }
  var out = [];
  for(var key in map){
    var group = finishAgg(map[key]);
    group.children = [];
    for(var ik in group.kids) group.children.push(finishAgg(group.kids[ik]));
    out.push(group);
  }
  return out;
}

function mixCell(g){
  return '<span class="mini BUY">' + g.BUY + "</span> " +
         '<span class="mini HOLD">' + g.HOLD + "</span> " +
         '<span class="mini SELL">' + g.SELL + "</span>" +
         (g.buyRatio === null ? "" : '<span class="ratio">BUY ' + g.buyRatio + "%</span>");
}

function changeCell(g){
  if(!g.up && !g.down) return '<span class="muted">-</span>';
  var out = [];
  if(g.up) out.push('<span class="up-n">▲' + num(g.up) + "</span>");
  if(g.down) out.push('<span class="down-n">▼' + num(g.down) + "</span>");
  return out.join(" ");
}

function sectorRow(g, isChild){
  var caret = "";
  if(!isChild){
    var open = !!openSectors[g.name];
    caret = '<button type="button" class="toggle" data-secopen="' + esc(g.name) + '" ' +
            'aria-expanded="' + (open ? "true" : "false") + '">' + (open ? "▾" : "▸") + "</button> ";
  }
  var html = '<tr class="' + (isChild ? "sec-child" : "sec-group") + '" data-sec="' + esc(g.sector) +
             '" data-ind="' + (isChild ? esc(g.name) : "") + '" title="이 업종의 리포트 보기">';
  html += "<td>" + caret + esc(g.name) + "</td>";
  html += '<td class="num strong">' + num(g.n) + "</td>";
  html += '<td class="num">' + num(g.stocks) + "</td>";
  html += "<td>" + mixCell(g) + "</td>";
  html += "<td>" + changeCell(g) + "</td>";
  html += '<td class="num">' + gapCell(g.gap) + "</td>";
  html += '<td class="date">' + esc((g.last || "").slice(2)) + "</td>";
  return html + "</tr>";
}

function renderSectorView(rows){
  $("thead").innerHTML = renderHead(SECTOR_COLS);
  var groups = groupBySector(rows);
  var keys = {};
  SECTOR_COLS.forEach(function(c){ if(c.get) keys[c.key] = c.get; });

  // 리포트 탭의 정렬 키(날짜 등)는 여기 없다. 그럴 땐 리포트 수 기준으로 본다.
  var savedKey = state.sortKey;
  if(!keys[state.sortKey]) state.sortKey = "n";
  groups = sortRows(groups, keys);

  var html = [], shown = 0;
  for(var i=0;i<groups.length;i++){
    var g = groups[i];
    html.push(sectorRow(g, false));
    if(openSectors[g.name]){
      var kids = sortRows(g.children, keys);
      for(var j=0;j<kids.length;j++) html.push(sectorRow(kids[j], true));
    }
    shown += g.children.length;
  }
  state.sortKey = savedKey;

  $("tbody").innerHTML = html.join("");
  return shown;
}

/* 업종 행을 누르면 리포트 탭으로 옮겨 가며 그 업종만 남긴다 */
function gotoSector(sector, industry){
  state.sectors = sector ? [sector] : [];
  state.industry = industry || "";
  state.view = "reports";
  state.sortKey = "date";
  state.sortDir = "desc";
  renderSectorChips();
  render();
  window.scrollTo(0, 0);
}

/* ------------------------------------------------ 전체 렌더 */
function render(){
  var rows = filtered();
  renderStats(rows);

  var shown;
  if(state.view === "sectors"){
    shown = renderSectorView(rows);
    $("count").textContent = "업종 " + num(shown) + "개 / 리포트 " + num(rows.length) + "건";
  }else if(state.view === "stocks"){
    shown = renderStocks(rows);
    $("count").textContent = "종목 " + num(shown) + "개 / 리포트 " + num(rows.length) + "건";
  }else{
    renderReports(rows);
    shown = rows.length;
    $("count").textContent = num(rows.length) + "건 / 전체 " + num(reports.length) + "건";
  }
  $("empty").hidden = shown > 0;
  $("table").hidden = shown === 0;

  syncControls();
  saveState();
  // 새로 보이게 된 종목이 있으면 그것만 추가로 조회한다
  scheduleQuotes();
}

/* 스크롤 위치를 지킨 채 다시 그린다 (시세·리포트 자동 갱신용) */
function renderKeepScroll(){
  var y = window.pageYOffset;
  render();
  window.scrollTo(0, y);
}

function marketLabel(){
  if(live.stopped) return "자동갱신 중단";
  if(inMarketHours()) return "장중";
  return "장외 · 1회 조회(자동갱신 없음)";
}

function renderUpdated(){
  var parts = [];
  if(meta && meta.updated_at){
    parts.push("리포트 갱신 " + meta.updated_at.replace("T", " ").slice(5, 16) + " KST");
  }
  parts.push(live.ok
    ? "시세 실시간 " + kstClock(live.at) + " (" + marketLabel() + ")"
    : "시세: 수집 시점 종가");
  $("updated").textContent = parts.join(" · ");
}

function syncControls(){
  var i, els;
  els = document.querySelectorAll("#periodSeg button");
  for(i=0;i<els.length;i++) els[i].setAttribute("aria-pressed", els[i].dataset.period === state.period);
  els = document.querySelectorAll("#viewSeg button");
  for(i=0;i<els.length;i++) els[i].setAttribute("aria-pressed", els[i].dataset.view === state.view);
  els = document.querySelectorAll("[data-rating]");
  for(i=0;i<els.length;i++) els[i].setAttribute("aria-pressed", state.ratings.indexOf(els[i].dataset.rating) >= 0);
  els = document.querySelectorAll("[data-change]");
  for(i=0;i<els.length;i++) els[i].setAttribute("aria-pressed", state.changes.indexOf(els[i].dataset.change) >= 0);
  els = document.querySelectorAll("[data-sector]");
  for(i=0;i<els.length;i++) els[i].setAttribute("aria-pressed", state.sectors.indexOf(els[i].dataset.sector) >= 0);

  $("brokerSummary").textContent = state.brokers.length
    ? "증권사 " + state.brokers.length + "곳 ▾"
    : "증권사 전체 ▾";

  renderIndustrySelect();
}

/* ------------------------------------------------ 업종 컨트롤 */
function rebuildSectors(){
  allSectors = SECTORS.slice();
  // 업종이 안 붙은 리포트가 있으면 그것도 고를 수 있게 칩을 하나 더 둔다
  for(var i=0;i<reports.length;i++){
    if(!reports[i].sector){ allSectors.push(UNCLASSIFIED); break; }
  }
  state.sectors = state.sectors.filter(function(s){ return allSectors.indexOf(s) >= 0; });
}

function renderSectorChips(){
  var html = ['<span class="lab">업종</span>'];
  for(var i=0;i<allSectors.length;i++){
    var s = allSectors[i];
    html.push('<button type="button" class="chip" data-sector="' + esc(s) + '">' + esc(s) + "</button>");
  }
  $("sectorChips").innerHTML = html.join("");
}

/* 세부 업종 목록은 지금 기간·필터 안에 실제로 있는 업종만, 건수와 함께 보여준다 */
function renderIndustrySelect(){
  var rows = filtered({skipIndustry:true});
  var counts = Object.create(null);
  for(var i=0;i<rows.length;i++){
    var k = rows[i].industry || UNCLASSIFIED;
    counts[k] = (counts[k] || 0) + 1;
  }
  var names = Object.keys(counts).sort(function(a, b){
    return counts[b] - counts[a] || a.localeCompare(b, "ko");
  });
  // 고른 업종이 지금 조건에 하나도 없더라도 선택 상태는 보여 준다
  if(state.industry && counts[state.industry] === undefined) names.unshift(state.industry);

  var html = ['<option value="">세부 업종 전체</option>'];
  for(var j=0;j<names.length;j++){
    html.push('<option value="' + esc(names[j]) + '">' + esc(names[j]) +
              " (" + num(counts[names[j]] || 0) + ")</option>");
  }
  var sel = $("industrySel");
  sel.innerHTML = html.join("");
  sel.value = state.industry || "";
  sel.className = state.industry ? "on" : "";
}

/* ------------------------------------------------ 이벤트 */
function toggleIn(arr, value){
  var i = arr.indexOf(value);
  if(i >= 0) arr.splice(i, 1); else arr.push(value);
}

function bind(){
  $("periodSeg").addEventListener("click", function(e){
    var b = e.target.closest("button[data-period]");
    if(!b) return;
    state.period = b.dataset.period;
    render();
  });

  $("viewSeg").addEventListener("click", function(e){
    var b = e.target.closest("button[data-view]");
    if(!b) return;
    state.view = b.dataset.view;
    render();
  });

  document.querySelector(".controls").addEventListener("click", function(e){
    var b = e.target.closest("[data-rating],[data-change],[data-sector]");
    if(!b) return;
    if(b.dataset.rating) toggleIn(state.ratings, b.dataset.rating);
    else if(b.dataset.change) toggleIn(state.changes, b.dataset.change);
    else toggleIn(state.sectors, b.dataset.sector);
    render();
  });

  $("industrySel").addEventListener("change", function(){
    state.industry = $("industrySel").value;
    render();
  });

  $("q").addEventListener("input", debounce(function(){
    state.q = $("q").value;
    render();
  }, 200));

  $("reset").addEventListener("click", function(){
    state.ratings = []; state.changes = []; state.brokers = [];
    state.sectors = []; state.industry = "";
    state.q = ""; $("q").value = "";
    state.period = "7"; state.sortKey = "date"; state.sortDir = "desc";
    renderBrokerList();
    render();
  });

  $("thead").addEventListener("click", function(e){
    var th = e.target.closest("th[data-sort]");
    if(!th) return;
    var key = th.dataset.sort;
    if(state.sortKey === key){
      state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
    }else{
      state.sortKey = key;
      // 이름·증권사는 가나다순이 자연스럽고, 수치는 큰 값부터가 자연스럽다
      state.sortDir = (key === "name" || key === "broker") ? "asc" : "desc";
    }
    render();
  });
  $("thead").addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){
      var th = e.target.closest("th[data-sort]");
      if(th){ e.preventDefault(); th.click(); }
    }
  });

  $("tbody").addEventListener("click", function(e){
    var b = e.target.closest("button[data-summary]");
    if(b){
      var id = b.dataset.summary;
      if(openSummaries[id]) delete openSummaries[id];
      else openSummaries[id] = true;
      render();
      return;
    }
    // 업종별 탭: 화살표는 접기/펼치기, 나머지 자리는 그 업종으로 이동
    var caret = e.target.closest("button[data-secopen]");
    if(caret){
      var key = caret.dataset.secopen;
      if(openSectors[key]) delete openSectors[key];
      else openSectors[key] = true;
      renderKeepScroll();
      return;
    }
    var tr = e.target.closest("tr[data-sec]");
    if(tr) gotoSector(tr.dataset.sec, tr.dataset.ind);
  });

  $("brokerAll").addEventListener("click", function(){
    state.brokers = allBrokers.slice();
    renderBrokerList(); render();
  });
  $("brokerNone").addEventListener("click", function(){
    state.brokers = [];
    renderBrokerList(); render();
  });
  $("brokerList").addEventListener("change", function(e){
    var cb = e.target;
    if(cb.type !== "checkbox") return;
    toggleIn(state.brokers, cb.value);
    render();
  });

  // 드롭다운 바깥을 누르면 닫는다
  document.addEventListener("click", function(e){
    var dd = $("brokerDd");
    if(dd.open && !dd.contains(e.target)) dd.open = false;
  });
}

function rebuildBrokers(){
  if(meta && Array.isArray(meta.brokers) && meta.brokers.length){
    allBrokers = meta.brokers.slice();
  }else{
    var set = Object.create(null);
    reports.forEach(function(r){ if(r.broker) set[r.broker] = 1; });
    allBrokers = Object.keys(set).sort(function(a,b){ return a.localeCompare(b, "ko"); });
  }
  // 사라진 증권사가 필터에 남아 있으면 걷어낸다
  state.brokers = state.brokers.filter(function(b){ return allBrokers.indexOf(b) >= 0; });
}

function renderBrokerList(){
  var html = [];
  for(var i=0;i<allBrokers.length;i++){
    var b = allBrokers[i];
    var on = state.brokers.indexOf(b) >= 0;
    html.push('<label><input type="checkbox" value="' + esc(b) + '"' +
              (on ? " checked" : "") + "> " + esc(b) + "</label>");
  }
  $("brokerList").innerHTML = html.join("");
}

/* ------------------------------------------------ 부팅 */
function showNotice(html){
  var n = $("notice");
  n.innerHTML = html;
  n.hidden = false;
}

function boot(){
  loadState();
  // 예전 버전이 남긴 값이나 손댄 저장소로 정렬이 깨지지 않게 한 번 걸러준다
  var VALID_SORT = ["date","name","broker","rating","target","price","gap","n","avg","max","min",
                    "industry","stocks","buy","up","last"];
  if(VALID_SORT.indexOf(state.sortKey) < 0) state.sortKey = "date";
  if(state.sortDir !== "asc" && state.sortDir !== "desc") state.sortDir = "desc";
  if(["reports","stocks","sectors"].indexOf(state.view) < 0) state.view = "reports";
  if(!Array.isArray(state.ratings)) state.ratings = [];
  if(!Array.isArray(state.changes)) state.changes = [];
  if(!Array.isArray(state.brokers)) state.brokers = [];
  if(!Array.isArray(state.sectors)) state.sectors = [];
  if(typeof state.industry !== "string") state.industry = "";
  if(typeof state.q !== "string") state.q = "";
  $("q").value = state.q || "";
  // 업종별 탭은 처음엔 다 펼쳐 둔다 (접은 상태는 저장하지 않는다)
  SECTORS.concat([UNCLASSIFIED]).forEach(function(s){ openSectors[s] = true; });

  Promise.all([
    fetch("data/reports.json", {cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("reports.json " + r.status);
      return r.json();
    }),
    fetch("data/meta.json", {cache:"no-store"}).then(function(r){
      return r.ok ? r.json() : null;
    }).catch(function(){ return null; })
  ]).then(function(res){
    reports = Array.isArray(res[0]) ? res[0] : [];
    meta = res[1];

    rebuildBrokers();
    rebuildSectors();
    renderUpdated();

    if(!reports.length){
      showNotice("수집된 리포트가 없습니다. <code>python scraper/collect.py --days 45</code> 를 먼저 실행해 주세요.");
      return;
    }

    renderBrokerList();
    renderSectorChips();
    bind();
    $("app").hidden = false;
    render();          // 끝에서 scheduleQuotes() 가 첫 시세 조회를 건다
    startTimers();
  }).catch(function(err){
    var isFile = location.protocol === "file:";
    showNotice(
      "<b>데이터를 불러오지 못했습니다.</b><br>" +
      (isFile
        ? "브라우저에서 <code>file://</code> 로 열면 보안 정책 때문에 JSON을 읽을 수 없습니다. " +
          "프로젝트 폴더에서 아래를 실행한 뒤 <code>http://localhost:3491</code> 로 접속하세요.<br>" +
          "<code>python -m http.server 3491</code>"
        : "<code>data/reports.json</code> 을 읽을 수 없습니다. 수집을 먼저 실행했는지 확인하세요.<br>" +
          "<code>python scraper/collect.py --days 45</code>") +
      '<br><span class="muted">' + esc(err && err.message ? err.message : err) + "</span>"
    );
  });
}

boot();
})();
</script>
</body>
</html>
