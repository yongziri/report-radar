<!DOCTYPE html>
<html lang="ko" data-theme="dark" data-cc="global">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공도 투자 연구소</title>
<style>
/* ===== 우리다움체 내장 (TTF->WOFF2 무손실 변환, 서브셋 없음) ===== */
__FONTS__
/* ===== Finviz 다크 토큰 ===== */
:root{
  --bg:#22262F; --panel:#353945; --panel2:#2C303A; --line:#4C5263; --line2:#5C6377;
  --tx:#F3F3F5; --tx2:#C3C6D0; --tx3:#8B91A1;
  --link:#2F91EF; --link-h:#4FA4F4;
  --up:#34C062; --down:#FD8487; --up-bg:#00A449; --down-bg:#FB5057;
  --heat-up:#19803D; --heat-mid:#414554; --heat-down:#691F24;
  --hot:#FD8487; --cold:#2F91EF;
}
html[data-cc="kr"]{
  --up:#FD8487; --down:#7FB2F5; --up-bg:#FB5057; --down-bg:#2F6FEF;
  --heat-up:#691F24; --heat-down:#1B3F86;
}
html[data-theme="light"]{
  --bg:#EEF0F4; --panel:#FFF; --panel2:#F5F6F9; --line:#C9CEDB; --line2:#AEB5C6;
  --tx:#1A1D24; --tx2:#4A5060; --tx3:#7A8091;
  --link:#1567C8; --link-h:#0F4E9C;
  --up:#1B8E43; --down:#D2373C;
  --heat-up:#1B8E43; --heat-mid:#B9BECC; --heat-down:#C2333A;
  --hot:#D2373C; --cold:#1567C8;
}
html[data-theme="light"][data-cc="kr"]{
  --up:#D2373C; --down:#1D5FC4; --heat-up:#C2333A; --heat-down:#1D5FC4;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-size:12px;line-height:1.45;
  font-family:"Wooridaum","IBM Plex Sans","Segoe UI",system-ui,-apple-system,"Malgun Gothic","맑은 고딕",sans-serif;
  -webkit-font-smoothing:antialiased}
/* 시세 표는 자릿수 정렬을 위해 고정폭 숫자 */
table,.num,.statgrid td.v,input[type=number],.tip,.ttip{font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link);text-decoration:none}
a:hover{color:var(--link-h);text-decoration:underline}
.wrap{max-width:1560px;margin:0 auto;padding:0 10px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--tx2)}
.hot{color:var(--hot)}.cold{color:var(--cold)}
.hide{display:none !important}

header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:60}
.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 0}
.brand{font-size:14px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
.brand span{color:var(--link)}
.tick{display:flex;gap:14px;flex-wrap:wrap;flex:1;min-width:0;font-size:11.5px;align-items:center}
.tick .t{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.tick .t .n{color:var(--tx2);font-weight:600;font-size:11px}
.tick .t b{font-weight:600}
.hd-r{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.upd{font-size:11px;color:var(--tx3);white-space:nowrap}
.scanind{font-size:10.5px;color:var(--link);font-weight:600;white-space:nowrap;
  border:1px solid var(--link);border-radius:2px;padding:1px 5px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:3px 8px;
  font-size:11px;font-weight:600;color:var(--tx2);white-space:nowrap}
.btn:hover{border-color:var(--line2);color:var(--tx)}
.btn.pri{background:var(--link);border-color:var(--link);color:#fff}
.btn.pri:hover{background:var(--link-h);color:#fff}
.btn.on{background:var(--up-bg);border-color:var(--up-bg);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.xs{padding:1px 5px;font-size:10.5px}
.mkb{font-size:10.5px;padding:2px 6px;border-radius:2px;border:1px solid var(--line);
  background:var(--panel2);color:var(--tx3);font-weight:600;white-space:nowrap}
.mkb.open{background:rgba(0,164,73,.18);border-color:var(--up-bg);color:var(--up)}

nav.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:none;border-bottom:2px solid transparent;
  padding:7px 15px;font-size:12px;font-weight:600;color:var(--tx2);white-space:nowrap}
nav.tabs button:hover{color:var(--tx);background:var(--panel2)}
nav.tabs button.act{color:var(--link);border-bottom-color:var(--link)}
main{padding:10px 0 26px}
.tab{display:none}.tab.act{display:block}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;margin-bottom:10px}
.ptitle{font-size:11.5px;font-weight:700;color:var(--tx2);padding:5px 8px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-transform:uppercase;letter-spacing:.3px}
.ptitle .sub{text-transform:none;letter-spacing:0;font-weight:400;color:var(--tx3);font-size:11px}
.ptitle .sp{margin-left:auto;display:flex;gap:5px;align-items:center;flex-wrap:wrap;
  text-transform:none;letter-spacing:0}
.pbody{padding:7px 8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:1000px){.grid3,.grid2{grid-template-columns:1fr}}

.tbw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:3px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);font-size:11.5px}
th{background:var(--panel2);color:var(--tx2);font-size:11px;font-weight:600;position:sticky;top:0;z-index:2}
th.l,td.l{text-align:left}
th.c,td.c{text-align:center}
tbody tr:hover{background:var(--panel2)}
tbody tr.clk{cursor:pointer}
tr:last-child td{border-bottom:none}
th.srt{cursor:pointer;user-select:none}
th.srt:hover{color:var(--tx)}
th.srt.on{color:var(--link)}
.tk{color:var(--link);font-weight:500}
tr:hover .tk{color:var(--link-h)}
.mk{font-size:9.5px;padding:0 3px;border-radius:2px;border:1px solid var(--line2);
  color:var(--tx3);margin-right:4px;vertical-align:1px}
.pill{display:inline-block;padding:0 4px;border-radius:2px;color:#fff;font-weight:600;font-size:10.5px}
.pill.u{background:var(--up-bg)}.pill.d{background:var(--down-bg)}
.badge-err{font-size:9.5px;background:var(--down-bg);color:#fff;padding:0 4px;border-radius:2px;margin-left:4px}
.empty{padding:16px 8px;text-align:center;color:var(--tx3);font-size:11.5px}

input[type=text],input[type=number],input[type=password],select,textarea{
  background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:3px 6px;
  font-size:11.5px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--link)}
input[type=number]{-moz-appearance:textfield}
input.cell{width:82px;text-align:right;padding:1px 5px}
label.fl{display:flex;flex-direction:column;gap:2px;font-size:10.5px;color:var(--tx3);font-weight:600}
.row{display:flex;gap:7px;flex-wrap:wrap;align-items:flex-end}

.srch{position:relative;min-width:190px;max-width:280px;flex:1}
.srch input{width:100%}
.sug{position:absolute;top:calc(100% + 2px);left:0;right:0;background:var(--panel);
  border:1px solid var(--line2);border-radius:3px;max-height:280px;overflow-y:auto;z-index:50;
  display:none;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.sug.open{display:block}
.sug div{padding:4px 8px;cursor:pointer;display:flex;gap:6px;align-items:center;
  font-size:11.5px;border-bottom:1px solid var(--line)}
.sug div:last-child{border-bottom:none}
.sug div:hover,.sug div.hi{background:var(--panel2)}
.sug .cd{color:var(--tx3);font-size:10.5px;margin-left:auto}
.sug .nohit{padding:7px 9px;color:var(--tx3);font-size:11px;line-height:1.5;cursor:default}
.sug .nohit:hover{background:none}

.ovw{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
.ovi{display:flex;flex-direction:column;gap:1px;min-width:118px}
.ovi .k{font-size:10.5px;color:var(--tx3);font-weight:600}
.ovi .v{font-size:17px;font-weight:600;letter-spacing:-.4px}
.ovi .c{font-size:11px}
.gauge{flex:1;min-width:230px;max-width:520px}
.glab{display:flex;justify-content:space-between;font-size:10.5px;font-weight:600;margin-bottom:3px}
.gbar{display:flex;height:13px;border-radius:2px;overflow:hidden;background:var(--panel2);border:1px solid var(--line)}
.gbar i{display:block;height:100%}
.gbar .gu{background:var(--up-bg)}.gbar .gf{background:var(--tx3)}.gbar .gd{background:var(--down-bg)}

.tmap{position:relative;width:100%;height:540px;background:var(--panel2);overflow:hidden}
.tmap.sm{height:430px}
.tsec{position:absolute;border:1px solid var(--panel);overflow:hidden}
.tsec>.sl{position:absolute;top:0;left:0;right:0;height:13px;background:var(--panel);
  color:var(--tx2);font-size:9.5px;font-weight:700;padding:0 4px;line-height:13px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile{position:absolute;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:#fff;text-align:center;line-height:1.1;
  border:1px solid rgba(0,0,0,.34)}
.tile:hover{outline:1px solid #fff;outline-offset:-1px;z-index:5}
.tile .tn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;padding:0 2px}
.tile .tp{font-variant-numeric:tabular-nums}
.ttip{position:fixed;z-index:300;background:var(--panel);border:1px solid var(--line2);border-radius:3px;
  padding:5px 8px;font-size:11px;pointer-events:none;display:none;min-width:150px;
  box-shadow:0 6px 18px rgba(0,0,0,.5)}
.ttip b{display:block;margin-bottom:2px;font-size:11.5px}
.ttip .r,.tip .r{display:flex;justify-content:space-between;gap:12px}
.ttip .r span:first-child,.tip .r span:first-child{color:var(--tx3)}
.tlegend{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--tx3)}
.tlegend i{width:15px;height:9px;display:block;border:1px solid rgba(0,0,0,.3)}

.statgrid{width:100%;border-collapse:collapse;table-layout:fixed}
.statgrid td{border:1px solid var(--line);padding:3px 6px;font-size:11.5px}
.statgrid td.k{background:var(--panel2);color:var(--tx2);font-weight:600;width:9.5%;text-align:left}
.statgrid td.v{text-align:right;width:15.5%;font-variant-numeric:tabular-nums}
@media(max-width:900px){
  .statgrid td.k{width:16%}.statgrid td.v{width:34%}
  .statgrid td.k:nth-child(n+5),.statgrid td.v:nth-child(n+5){display:none}
}

.chw{position:relative;padding:4px}
#chart{width:100%;height:500px;display:block;cursor:crosshair}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line2);
  border-radius:3px;padding:5px 8px;font-size:11px;display:none;z-index:20;min-width:128px;
  box-shadow:0 6px 18px rgba(0,0,0,.5);font-variant-numeric:tabular-nums}
.tip b{display:block;margin-bottom:2px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{background:none;border:none;padding:2px 8px;font-size:11px;font-weight:600;color:var(--tx3)}
.seg button:hover{color:var(--tx)}
.seg button.act{background:var(--link);color:#fff}
.malegend{display:flex;gap:4px;flex-wrap:wrap}
.malegend button{border:1px solid var(--line);background:var(--panel2);border-radius:3px;
  padding:1px 6px;font-size:10.5px;font-weight:600;color:var(--tx3);display:flex;align-items:center;gap:4px}
.malegend button .dot{width:8px;height:2px;background:currentColor;opacity:.3}
.malegend button.on .dot{opacity:1}

/* ===== 스크리너 ===== */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:5px}
.fcell{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:3px 5px}
.fcell .fk{font-size:10px;color:var(--tx3);font-weight:700;margin-bottom:2px}
.fcell select{width:100%;padding:1px 3px;font-size:11px}
.fcell.on{border-color:var(--link)}
.fcell.on .fk{color:var(--link)}
.fmm{display:flex;gap:3px;margin-top:3px}
.fmm input{width:100%;text-align:right;padding:1px 4px;font-size:10.5px}
.fcell .deep{color:var(--tx3);font-weight:400}
.presets{display:flex;gap:4px;flex-wrap:wrap}
.presets button{border:1px solid var(--line);background:var(--panel2);border-radius:3px;
  padding:2px 8px;font-size:11px;font-weight:600;color:var(--tx2)}
.presets button:hover{border-color:var(--link);color:var(--tx)}
.presets button.act{background:var(--link);border-color:var(--link);color:#fff}
.prog{height:5px;background:var(--panel2);border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.prog>div{height:100%;background:var(--link);width:0;transition:width .18s}
.colpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:2px 10px;
  max-height:190px;overflow-y:auto;padding:6px 8px;border-top:1px solid var(--line);background:var(--panel2)}
.colpick label{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--tx2);cursor:pointer}
.sumline{font-size:11px;color:var(--tx2);padding:4px 8px;border-top:1px solid var(--line);
  display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sumline b{color:var(--tx)}

/* ===== 업종 퍼포먼스 ===== */
.secrow{display:grid;grid-template-columns:104px 1fr 62px 78px;gap:7px;align-items:center;
  padding:2px 0;cursor:pointer;font-size:11px}
.secrow:hover{background:var(--panel2)}
.secrow .sn{color:var(--tx2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.secbar{position:relative;height:13px;background:var(--panel2);border:1px solid var(--line);border-radius:2px}
.secbar i{position:absolute;top:0;bottom:0;display:block}
.secbar .mid{position:absolute;top:-1px;bottom:-1px;width:1px;background:var(--line2);left:50%}
.secrow .sv{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.secrow .sr{text-align:right;font-size:10px;color:var(--tx3);font-variant-numeric:tabular-nums}

/* ===== 미니차트 팝업 / 차트 그리드 ===== */
.mpop{position:fixed;z-index:320;background:var(--panel);border:1px solid var(--line2);border-radius:3px;
  padding:5px 6px;display:none;box-shadow:0 8px 22px rgba(0,0,0,.55);pointer-events:none}
.mpop .mh{display:flex;justify-content:space-between;gap:10px;font-size:11px;margin-bottom:3px}
.mpop .mh b{font-weight:700}
.mpop canvas{display:block}
.mpop .mf{font-size:10px;color:var(--tx3);margin-top:2px;display:flex;justify-content:space-between;gap:8px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:7px;padding:8px}
.ccard{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:5px 6px;cursor:pointer}
.ccard:hover{border-color:var(--link)}
.ccard .ch{display:flex;justify-content:space-between;gap:6px;font-size:11px;margin-bottom:3px}
.ccard .ch .tk{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard canvas{display:block;width:100%}

.note{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--link);
  border-radius:2px;padding:7px 9px;font-size:11.5px;color:var(--tx2);line-height:1.6}
.note b{color:var(--tx)}
.log{max-height:250px;overflow-y:auto}
.log .it{border-bottom:1px solid var(--line);padding:4px 0;font-size:11.5px}
.log .it:last-child{border-bottom:none}
.log .t{font-size:10px;color:var(--tx3)}
.news ul{margin:0;padding:0}
.news li{border-bottom:1px solid var(--line);padding:5px 0;list-style:none;line-height:1.4}
.news li:last-child{border-bottom:none}
.news li a{color:var(--tx);font-weight:500}
.news li a:hover{color:var(--link-h)}
.news .dt{font-size:10px;color:var(--tx3);margin-top:2px}
.news .src{color:var(--link)}
.newsbox{max-height:340px;overflow-y:auto}
.stalebadge{font-size:9.5px;background:var(--panel2);border:1px solid var(--down-bg);color:var(--down);
  padding:0 4px;border-radius:2px}
tr.mine{background:rgba(47,145,239,.13)}
tr.mine .tk{font-weight:700}
.dcbox{max-height:340px;overflow-y:auto}
.chk{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--tx2);cursor:pointer}
.chk input{width:auto}

/* ===== 기업분석 iframe ===== */
.cmpwrap{position:relative;background:#fff;border-top:1px solid var(--line)}
#cmpFrame{display:block;width:100%;border:0;min-height:1200px}
.cmpload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:8px;background:var(--panel);color:var(--tx2);font-size:12px;z-index:3}
.spin{width:22px;height:22px;border:2px solid var(--line2);border-top-color:var(--link);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:200;
  align-items:flex-start;justify-content:center;padding:30px 12px;overflow-y:auto}
.mask.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:4px;max-width:560px;width:100%}
.modal h3{margin:0;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;display:flex;align-items:center}
.modal h3 button{margin-left:auto;background:none;border:none;color:var(--tx2);font-size:17px;line-height:1}
.modal .bd{padding:11px 12px;display:flex;flex-direction:column;gap:11px}
.modal .ft{padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:6px;justify-content:flex-end}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:11.5px;font-weight:700}
.fld .hint{font-size:10.5px;color:var(--tx3);line-height:1.55}
.fld input,.fld textarea{width:100%}
.fld textarea{resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:11px;line-height:1.5}

/* ===== 잔고 가져오기 미리보기 ===== */
.imptbl{font-size:11px}
.imptbl td,.imptbl th{border-bottom:1px solid var(--line);border-right:1px solid var(--line);
  padding:2px 5px;text-align:left;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.imptbl tr.skip td{color:var(--tx3);background:var(--panel2);text-decoration:line-through}
.imptbl tr.unmatched td{background:rgba(251,80,87,.12)}
.imptbl select{width:100%;padding:1px 2px;font-size:10.5px}
.imptbl .mapped{color:var(--link);font-weight:700}
.impfix{display:flex;gap:6px;align-items:center;margin-bottom:4px;font-size:11.5px}
.impfix input{width:110px}
.impfix .nm{min-width:130px;color:var(--tx2)}

/* ===== 증권사 리포트 (리포트 탭 · 대시보드/종목분석 연동) ===== */
.rfl{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--tx3);font-weight:600}
.rfl>.k{text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel2);color:var(--tx3);padding:2px 9px;
  border-radius:2px;font-size:11px;font-weight:600;white-space:nowrap}
.chip:hover{border-color:var(--line2);color:var(--tx)}
.chip.act{background:var(--link);border-color:var(--link);color:#fff}
.chip.r-BUY.act{background:var(--up-bg);border-color:var(--up-bg)}
.chip.r-SELL.act{background:var(--down-bg);border-color:var(--down-bg)}
.chip.r-HOLD.act{background:var(--line2);border-color:var(--line2)}
.chip.r-NR.act{background:var(--tx3);border-color:var(--tx3)}

/* 증권사 다중 선택 드롭다운 */
.dd{position:relative}
.dd>summary{list-style:none;cursor:pointer;padding:2px 8px;border:1px solid var(--line);border-radius:3px;
  background:var(--panel2);font-size:11.5px;font-weight:600;color:var(--tx2);user-select:none;white-space:nowrap}
.dd>summary::-webkit-details-marker{display:none}
.dd[open]>summary{border-color:var(--link);color:var(--tx)}
.dd-panel{position:absolute;z-index:50;top:calc(100% + 3px);left:0;width:260px;max-height:300px;overflow:auto;
  background:var(--panel);border:1px solid var(--line2);border-radius:3px;padding:6px;
  box-shadow:0 6px 18px rgba(0,0,0,.45)}
.dd-panel label{display:flex;gap:6px;align-items:center;padding:2px 4px;border-radius:2px;cursor:pointer;
  font-size:11.5px;color:var(--tx2);font-weight:400}
.dd-panel label:hover{background:var(--panel2);color:var(--tx)}
.dd-panel input{width:auto}
.dd-actions{display:flex;gap:5px;margin-bottom:5px;position:sticky;top:0;background:var(--panel);padding-bottom:5px}
.dd-actions button{flex:1}

/* 자동완성 (.srch/.sug 확장) */
.sug.acx{width:330px;max-width:88vw;right:auto}
.sug .sec{padding:4px 8px 2px;font-size:10px;font-weight:700;letter-spacing:.3px;color:var(--tx3);
  border-top:1px solid var(--line);border-bottom:none;cursor:default;display:block}
.sug .sec:first-child{border-top:0}
.sug .sec:hover{background:none}
.sug .nm{font-weight:600;color:var(--tx);white-space:nowrap}
.sug mark{background:none;color:var(--link);font-weight:700}
.sug .ind{color:var(--tx3);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug .n{margin-left:auto;color:var(--tx2);font-size:10.5px;font-weight:600;white-space:nowrap}
.sug .cd{margin-left:0}

/* 고른 종목·검색어 칩 */
.selbar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:0 0 10px}
.selchip{display:inline-flex;align-items:center;gap:5px;padding:1px 3px 1px 8px;border-radius:2px;
  font-size:11px;font-weight:600;background:var(--panel2);border:1px solid var(--link);color:var(--tx)}
.selchip .c{color:var(--tx3)}
.selchip .x{border:0;background:none;font-size:13px;line-height:1;color:var(--tx3);padding:0 4px}
.selchip .x:hover{color:var(--tx)}

/* 리포트 표: 시세표와 달리 제목·요약이 줄바꿈되어야 한다 */
.rtbl{min-width:940px}
.rtbl td.wr{white-space:normal}
.rtbl td.dt,.rtbl th.dt{color:var(--tx3)}
.rtbl td{vertical-align:top}
.rtbl .rtitle{color:var(--tx)}
.rtbl .rtitle:hover{color:var(--link-h)}
.rcode{color:var(--tx3);font-size:10.5px;margin-left:5px;font-variant-numeric:tabular-nums}
.rnav{color:var(--tx3);font-size:10px;margin-left:3px}
.rnav:hover{color:var(--link)}
.rind,.rsub{display:block;color:var(--tx3);font-size:10.5px;margin-top:1px}
.rind2{color:var(--tx2)}
.rbadge{display:inline-block;min-width:38px;text-align:center;padding:0 5px;border-radius:2px;
  font-size:10.5px;font-weight:700;letter-spacing:.3px;color:#fff}
.rbadge.BUY{background:var(--up-bg)}
.rbadge.SELL{background:var(--down-bg)}
.rbadge.HOLD{background:var(--line2)}
.rbadge.NR{background:transparent;border:1px solid var(--line2);color:var(--tx3)}
.rmini{display:inline-block;min-width:22px;text-align:center;padding:0 4px;border-radius:2px;
  font-size:10.5px;font-weight:700;color:#fff}
.rmini.BUY{background:var(--up-bg)}
.rmini.SELL{background:var(--down-bg)}
.rmini.HOLD{background:var(--line2)}
.ratio{color:var(--tx3);font-size:10.5px;font-weight:600;margin-left:5px}
.tgt{font-size:10px;font-weight:700;margin-left:3px}
.tgt.new{color:var(--link);font-size:9.5px;letter-spacing:.3px}
.gapv{display:inline-block;padding:0 4px;border-radius:2px;font-weight:600;min-width:54px;text-align:right}
.chgt{display:block;font-size:10px;font-weight:600;margin-top:1px}
.tgl{border:0;background:none;color:var(--tx3);font-size:11px;padding:0 4px}
.tgl:hover{color:var(--link)}
tr.sumrow td{background:var(--panel2);color:var(--tx2);font-size:11.5px;line-height:1.65;padding:7px 10px 9px}
tr.morerow td{padding:8px 6px;background:var(--panel2)}
tr.secgroup>td{background:var(--panel2);font-weight:700}
tr.secgroup,tr.secchild{cursor:pointer}
tr.secchild>td:first-child{padding-left:24px}
tr.secchild>td{color:var(--tx2)}
.ovi.sm{min-width:78px}
select.on{color:var(--tx);border-color:var(--link)}

/* ===== 계좌 탭 ===== */
.actbl{min-width:1020px}
.actbl input.cell{width:88px}
.actbl input.memo{width:100%;min-width:150px;text-align:left}
.actbl td.mv{white-space:nowrap}
.actbl td.mv button{padding:0 4px;line-height:1.5}
.actbl .acnm{cursor:pointer}
.actbl .acnm:hover{color:var(--link-h)}
#acTabs button .n{opacity:.65;font-weight:400;margin-left:2px}

@media(max-width:768px){
  .rfl{flex:1 1 100%;min-width:0}
  .rfl>.seg,.rfl>.chips,.rfl>select,.rfl>.srch,.rfl>.dd{width:100%;max-width:none}
  .seg{flex-wrap:wrap}
  .dd>summary{text-align:center}
  .sug.acx{width:100%}
}

#toasts{position:fixed;right:10px;bottom:10px;z-index:400;display:flex;flex-direction:column;gap:6px;max-width:310px}
.toast{background:var(--panel);border:1px solid var(--line2);border-left:2px solid var(--link);
  border-radius:3px;padding:7px 10px;font-size:11.5px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.toast.err{border-left-color:var(--down-bg)}
.toast.ok{border-left-color:var(--up-bg)}
footer{border-top:1px solid var(--line);padding:9px 0 20px;color:var(--tx3);font-size:10.5px;line-height:1.7}
@media(max-width:760px){.upd{display:none}#chart{height:400px}.tmap{height:420px}}
</style>
</head>
