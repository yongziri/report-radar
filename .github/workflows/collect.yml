name: 리포트 수집 및 배포

# 평일 KST 07:00~19:00 에 돈다. 리포트가 몰리는 장 시작 전후(07~10시)는 15분 간격,
# 그 뒤로는 매시 정각이다. GitHub Actions는 UTC로만 cron을 받는다.
# KST = UTC+9 이므로 KST 07~08시는 전날 UTC 22~23시, KST 09~19시는 당일 UTC 00~10시다.
#
# 주의: schedule로 돌린 워크플로가 밀어넣은 커밋은 다른 워크플로를 다시 깨우지 않는다.
#       그래서 배포(deploy) 잡을 수집과 같은 워크플로 안에 둔다.
on:
  schedule:
    - cron: '*/15 22-23 * * 0-4' # KST 평일 07:00~08:59 (15분 간격)
    - cron: '*/15 0 * * 1-5'     # KST 평일 09:00~09:59 (15분 간격)
    - cron: '0 1-10 * * 1-5'     # KST 평일 10:00~19:00 (매시 정각)
  workflow_dispatch:
    inputs:
      args:
        description: '수집기 추가 옵션 (예: --wise-backfill --direct-backfill --perf)'
        required: false
        default: ''
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

# 수집과 배포가 겹치지 않게 한 번에 하나만 돈다.
concurrency:
  group: report-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 평소 실행은 1분 안팎. 과거분 수집이 붙는 첫 실행도 이 안에 끝나야 한다.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      # 파서 테스트가 깨지면 수집하지 않고 잡을 실패시킨다(메일 알림).
      # 배포 잡은 if: always() 라서 기존 데이터로 계속 배포된다.
      - name: 수집기 파서 테스트
        run: python scraper/test_parsers.py

      - name: 리포트 수집
        env:
          EXTRA_ARGS: ${{ github.event.inputs.args }}
        run: python scraper/collect.py $EXTRA_ARGS

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A: 지워진 파일(옛 v1 reports.json, 보관 기간이 지난 달 파일)도 함께 올린다
          git add -A data
          # 바뀐 게 없으면 커밋을 건너뛴다 (빈 커밋으로 이력을 더럽히지 않는다)
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            # 체크아웃이 detached HEAD 여도 확실히 main 으로 올라가게 한다
            # 수집하는 동안 main 에 다른 커밋이 올라왔으면 그 위에 얹어서 올린다
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # 소스가 조용히 멈춘 경우를 잡는다. 데이터 커밋·push 다음에 두어야
      # 여기서 잡이 실패해도 그날 모은 데이터는 남고, 메일 알림만 온다.
      - name: 소스 정지 점검
        run: python scraper/check_sources.py

  deploy:
    needs: collect
    # 수집 잡이 소스 경보로 실패해도 배포는 그대로 돌린다.
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 수집 잡이 방금 밀어넣은 data/*.json 까지 포함해서 받아온다.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 화면 파서 테스트
        run: node app/test_parsers.mjs

      # 배포되는 index.html 은 늘 app/parts 에서 새로 조립한 것이다 (표준 라이브러리만 씀).
      - name: 화면 빌드
        run: python app/build.py

      - uses: actions/configure-pages@v5
        with:
          # 첫 실행에서 Pages를 자동 활성화한다 (Settings 수동 설정 불필요).
          enablement: true

      # index.html 과 data/ 가 루트에 있으므로 저장소 전체를 그대로 올린다.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
